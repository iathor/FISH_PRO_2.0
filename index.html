<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1120">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Клёв ПРО">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Клёв ПРО 2.0</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://api.open-meteo.com">
  <link rel="preconnect" href="https://nominatim.openstreetmap.org">
  <link rel="preconnect" href="https://unpkg.com">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('kp.theme') || 'auto';
        var eff = saved === 'auto'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : saved;
        document.documentElement.setAttribute('data-theme', eff);
        document.documentElement.setAttribute('data-theme-mode', saved);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a href="#main" class="skip-link">Перейти к содержимому</a>
  <div class="app-shell">
    <header id="app-header" class="app-header" role="banner"></header>
    <main id="main" class="app-main" role="main" tabindex="-1"></main>
    <nav id="app-nav" class="app-nav" role="navigation" aria-label="Основная навигация"></nav>
    <div id="app-toasts" class="toast-container" aria-live="polite" aria-atomic="true"></div>
    <div id="app-offline" class="offline-banner" hidden role="status">Нет соединения — показаны кэшированные данные</div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
