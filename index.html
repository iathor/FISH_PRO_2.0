<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b1120">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Клёв ПРО 2.0">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Клёв ПРО 2.0 • Прогноз клёва, Круг и Атлас Ихтиофауны РФ</title>
  <link rel="manifest" href="manifest.json?v=2.0.1611">
  <link id="dynamicFavicon" rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">
  <link id="dynamicTouchIcon" rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <script>
    (function() {
      try {
        var raw = localStorage.getItem('klev_pro_state_v2.0');
        var saved = raw ? JSON.parse(raw).theme : 'auto';
        var eff = saved === 'auto'
          ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : (saved || 'dark');
        document.documentElement.setAttribute('data-theme', eff);
      } catch (e) {}

      // Мгновенная синхронная проверка установленного ярлыка/PWA до отрисовки body (исключает секундное моргание кнопки установки)
      try {
        var isStandalone = (window.matchMedia && (
          window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: fullscreen)').matches ||
          window.matchMedia('(display-mode: minimal-ui)').matches
        )) || window.navigator.standalone === true || (document.referrer && document.referrer.indexOf('android-app://') !== -1);
        if (isStandalone) {
          localStorage.setItem('klev_pro_pwa_installed', '1');
        }
        if (isStandalone || localStorage.getItem('klev_pro_pwa_installed') === '1') {
          document.documentElement.setAttribute('data-pwa-installed', '1');
        }
      } catch (e) {}

      // Безопасная фоновая очистка устаревших кэшей прошлых сборок (без принудительной перезагрузки страницы)
      try {
        var MIGRATION_KEY = 'klev_pro_migrated_v2016';
        if (localStorage.getItem(MIGRATION_KEY) !== '1' && 'caches' in window) {
          caches.keys().then(function(keys) {
            return Promise.all(
              keys
                .filter(function(k) { return k !== 'klev-pro-static-v2.0.1611'; })
                .map(function(k) { return caches.delete(k); })
            );
          }).then(function() {
            localStorage.setItem(MIGRATION_KEY, '1');
          }).catch(function() {});
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/tokens.css?v=2.0.1611">
  <link rel="stylesheet" href="css/base.css?v=2.0.1611">
  <link rel="stylesheet" href="css/components.css?v=2.0.1611">
  <link rel="stylesheet" href="css/layout.css?v=2.0.1611">
  <!-- Неблокирующая асинхронная загрузка картографического движка Leaflet -->
  <script>
    (function() {
      var cssUrls = [
        'https://yastatic.net/s3/front-maps-static/leaflet/1.9.4/leaflet.css',
        'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'
      ];
      var jsUrls = [
        'https://yastatic.net/s3/front-maps-static/leaflet/1.9.4/leaflet.js',
        'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js'
      ];
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = cssUrls[0];
      link.onerror = function() { link.href = cssUrls[1]; };
      document.head.appendChild(link);

      function loadLeafletScript(idx) {
        if (idx >= jsUrls.length || typeof window.L !== 'undefined') return;
        var s = document.createElement('script');
        s.src = jsUrls[idx];
        s.async = true;
        s.onload = function() {
          var box = document.getElementById('mapBox');
          if (box && box.offsetParent !== null && typeof window.__KLEV_RENDER_MAP__ === 'function') {
            window.__KLEV_RENDER_MAP__(box);
          }
        };
        s.onerror = function() { loadLeafletScript(idx + 1); };
        document.head.appendChild(s);
      }
      loadLeafletScript(0);
    })();
  </script>
</head>
<body>
  <header class="app-header">
    <div class="header-bar">
      <div class="loc-summary">
        <div class="loc-sub" id="headerLocSub">Волжско-Каспийский бассейн (Волга, Кама, Урал)</div>
        <div class="loc-main" id="headerLocMain">
          <span class="loc-main-text" id="headerLocText">📍 Москва</span>
          <span class="pill pill-good" id="headerStatusPill" role="status">🟢 Онлайн</span>
        </div>
      </div>
      <div class="header-controls">
        <button type="button" class="btn btn-icon btn-install-header" id="installAppBtn" data-install-app aria-label="Установить приложение" title="📲 Ярлык на экран">📲</button>
        <button type="button" class="btn btn-icon" id="headerModeBtn" aria-label="Режим интерфейса (Новичок / Рыбак / Профи)" title="Режим: 🟡 Рыбак (нажмите для смены: Новичок / Рыбак / Профи)">🟡</button>
        <button type="button" class="btn btn-icon" id="headerVersionBtn" aria-label="Что нового в версии и проверка обновлений" title="Что нового в версии 2.0.161">📦</button>
        <button type="button" class="btn btn-icon" id="headerProfileBtn" aria-label="Профиль рыболова" title="Профиль рыболова">⚙️</button>
        <button type="button" class="btn btn-icon" id="headerRefreshBtn" aria-label="Обновить метеоданные и проверить релиз" title="Обновить метеоданные и проверить обновление">🔄</button>
        <button type="button" class="btn btn-icon" id="headerThemeBtn" aria-label="Переключить тему" title="Переключить тему">🌓</button>
      </div>
    </div>
    <div class="season-strip open-water" id="headerSeasonStrip" role="region" aria-label="Ледовая обстановка">
      <span>🌊 Расчёт термического и ледового режима водоёма...</span>
    </div>
  </header>

  <main id="app" class="app-main">
    <section id="secGeo" data-route-section="geo" aria-label="Геолокация и выбор водоёма"></section>
    <section id="secFish" data-route-section="fish" aria-label="Рыбы в месте ловли"></section>
    <section id="secForecast" data-route-section="forecast" aria-label="Прогноз клёва и архив"></section>
    <section id="secWeather" data-route-section="weather" aria-label="Погода и фазы Луны"></section>
    <section id="secCircle" data-route-section="circle" aria-label="Круг, Экипаж 72ч и Мастерская снастей"></section>
    <section id="secCalendar" data-route-section="calendar" aria-label="Годовой биоритм и нерест"></section>
    <section id="secLog" data-route-section="log" aria-label="Журнал уловов"></section>
  </main>

  <!-- Нижняя навигация: Карта / Погода / Обзор / Рыбы / Прогноз + всплывающий блок ⋮ (Круг и Экипаж, Календарь, Журнал) -->
  <nav class="bottom-nav" aria-label="Навигация по разделам">
    <div class="bottom-nav-inner">
      <button type="button" class="nav-tab" data-nav-tab="geo" aria-label="Карта и водоём"><span>📍</span><span>Карта</span></button>
      <button type="button" class="nav-tab" data-nav-tab="weather" aria-label="Погода и Луна"><span>🌦️</span><span>Погода</span></button>
      <button type="button" class="nav-tab active" data-nav-tab="dashboard" aria-label="Все разделы"><span>🧭</span><span>Обзор</span></button>
      <button type="button" class="nav-tab" data-nav-tab="fish" aria-label="Рыбы"><span>🐟</span><span>Рыбы</span></button>
      <button type="button" class="nav-tab" data-nav-tab="forecast" aria-label="Прогноз клёва"><span>🎣</span><span>Прогноз</span></button>
      <div class="nav-more-wrap">
        <button type="button" class="nav-tab nav-more-btn" id="navMoreBtn" aria-label="Дополнительные разделы (Круг, Календарь и Журнал)" aria-expanded="false" title="Круг, Календарь и Журнал">
          <span>⋮</span>
          <span style="font-size:10px;">Ещё</span>
        </button>
        <div class="nav-more-popup" id="navMorePopup" role="menu" aria-label="Дополнительные вкладки">
          <button type="button" class="nav-popup-item" data-nav-tab="circle" role="menuitem"><span>👥</span><span>Круг и Экипаж (72ч)</span></button>
          <button type="button" class="nav-popup-item" data-nav-tab="calendar" role="menuitem"><span>📅</span><span>Календарь биоритмов</span></button>
          <button type="button" class="nav-popup-item" data-nav-tab="log" role="menuitem"><span>📓</span><span>Журнал уловов</span></button>
        </div>
      </div>
    </div>
  </nav>

  <script type="module" src="js/app.js?v=2.0.1611"></script>
  <script>
    // Защитный сторожевой таймер (только на случай полного обрыва загрузки скрипта в старом Service Worker)
    setTimeout(function() {
      if (!window.__KLEV_BOOTSTRAPPED__) {
        var mainEl = document.getElementById('app');
        if (mainEl && (!mainEl.children[0] || !mainEl.children[0].innerHTML.trim())) {
          var box = document.createElement('div');
          box.className = 'card';
          box.style.cssText = 'border-color:var(--accent);text-align:center;padding:18px;margin-top:24px;';
          box.innerHTML =
            '<div style="font-size:17px;font-weight:800;margin-bottom:8px;">🚀 Доступна новая сборка «Клёв ПРО 2.0.161»</div>' +
            '<p style="font-size:14px;color:var(--muted);margin-bottom:14px;line-height:1.45;">Обнаружены устаревшие файлы в кэше телефона. Нажмите кнопку ниже, чтобы обновить модули приложения (ваши точки и уловы сохранятся).</p>' +
            '<button type="button" class="btn btn-good" id="emergencyResetCacheBtn" style="width:100%;">✅ Обновить кэш и запустить новую версию</button>';
          mainEl.prepend(box);
          var btn = document.getElementById('emergencyResetCacheBtn');
          if (btn) {
            btn.onclick = function() {
              btn.textContent = '⏳ Очистка старого кэша...';
              Promise.resolve()
                .then(function() {
                  if ('serviceWorker' in navigator) {
                    return navigator.serviceWorker.getRegistrations().then(function(regs) {
                      return Promise.all(regs.map(function(r) { return r.unregister(); }));
                    });
                  }
                })
                .then(function() {
                  if ('caches' in window) {
                    return caches.keys().then(function(keys) {
                      return Promise.all(keys.map(function(k) { return caches.delete(k); }));
                    });
                  }
                })
                .finally(function() {
                  window.location.replace(window.location.pathname + '?v=2.0.161&reset=' + Date.now());
                });
            };
          }
        }
      }
    }, 6500);
  </script>
</body>
</html>
