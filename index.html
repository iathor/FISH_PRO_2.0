<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1120">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Клёв ПРО 2.0">
  <title>Клёв ПРО 2.0 • Прогноз клёва и Атлас Ихтиофауны РФ</title>
  <script>
    (function() {
      try {
        var raw = localStorage.getItem('klev_pro_state_v2.0');
        var saved = raw ? JSON.parse(raw).theme : 'auto';
        var eff = saved === 'auto'
          ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : (saved || 'dark');
        document.documentElement.setAttribute('data-theme', eff);
      } catch (e) {}
    })();
  </script>
  <style>
:root {
  --bg: #0b1120;
  --panel: #151f32;
  --card: #1e293b;
  --input-bg: #0f172a;
  --text: #f8fafc;
  --muted: #cbd5e1;
  --accent: #38bdf8;
  --accent-strong: #0284c7;
  --good: #10b981;
  --warn: #f59e0b;
  --bad: #ef4444;
  --ice: #67e8f9;
  --border: #334155;

  --chip-bg: #1e293b;
  --chip-border: #334155;
  --pill-good-bg: rgba(16, 185, 129, 0.18);
  --pill-good-text: #34d399;
  --pill-warn-bg: rgba(245, 158, 11, 0.18);
  --pill-warn-text: #fbbf24;
  --pill-bad-bg: rgba(239, 68, 68, 0.20);
  --pill-bad-text: #f87171;
  --pill-purple-bg: rgba(168, 85, 247, 0.20);
  --pill-purple-text: #d8b4fe;
  --pill-ice-bg: rgba(103, 232, 249, 0.16);
  --pill-ice-text: #67e8f9;

  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --fs-xs: 11px;
  --fs-sm: 13px;
  --fs-md: 15px;
  --fs-lg: 17px;

  --r-sm: 8px;
  --r-md: 12px;
  --r-pill: 999px;

  --shadow-card: 0 4px 14px 0 rgba(0, 0, 0, 0.30);
  --shadow-header: 0 3px 14px 0 rgba(0, 0, 0, 0.42);
}

[data-theme="light"] {
  --bg: #f1f5f9;
  --panel: #ffffff;
  --card: #f8fafc;
  --input-bg: #ffffff;
  --text: #0f172a;
  --muted: #475569;
  --accent: #0284c7;
  --accent-strong: #0369a1;
  --good: #059669;
  --warn: #b45309;
  --bad: #dc2626;
  --ice: #0e7490;
  --border: #cbd5e1;

  --chip-bg: #ffffff;
  --chip-border: #cbd5e1;
  --pill-good-bg: #d1fae5;
  --pill-good-text: #065f46;
  --pill-warn-bg: #fef3c7;
  --pill-warn-text: #92400e;
  --pill-bad-bg: #fee2e2;
  --pill-bad-text: #991b1b;
  --pill-purple-bg: #f3e8ff;
  --pill-purple-text: #6b21a8;
  --pill-ice-bg: #cffafe;
  --pill-ice-text: #155e75;

  --shadow-card: 0 4px 12px 0 rgba(15, 23, 42, 0.06);
  --shadow-header: 0 3px 12px 0 rgba(15, 23, 42, 0.09);
}


* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: var(--font-ui);
  -webkit-tap-highlight-color: transparent;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--text);
  line-height: 1.42;
  padding-bottom: 80px;
  transition: background-color 0.2s ease, color 0.2s ease;
}

button, select, input, a {
  font: inherit;
  color: inherit;
}

button:focus-visible, select:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}


.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--card);
  color: var(--text);
  border: 1.5px solid var(--border);
  min-height: 40px;
  padding: 6px 12px;
  border-radius: var(--r-sm);
  font-size: var(--fs-sm);
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: transform 0.12s ease, border-color 0.15s ease, background-color 0.15s ease;
  text-decoration: none;
  user-select: none;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: scale(0.98); }
.btn-accent { background: var(--accent-strong); border-color: var(--accent); color: #ffffff; }
.btn-good { background: var(--good); border-color: var(--good); color: #ffffff; }
.btn-sm { min-height: 32px; padding: 4px 10px; font-size: var(--fs-xs); border-radius: 6px; }
.btn-icon { width: 36px; min-width: 36px; height: 36px; min-height: 36px; padding: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; border-radius: var(--r-sm); }

.w-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 30px;
  padding: 4px 10px;
  border-radius: var(--r-pill);
  background: var(--card);
  border: 1px solid var(--border);
  font-size: var(--fs-xs);
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
  transition: border-color 0.15s ease, background-color 0.15s ease;
}
.w-chip:hover { border-color: var(--accent); }
.w-chip.active { background: var(--accent-strong); border-color: var(--accent); color: #ffffff; }

.chip-scroll-row {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: thin;
}

.toolbar-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: var(--r-pill);
  font-size: var(--fs-xs);
  font-weight: 700;
  border: 1px solid transparent;
  line-height: 1.2;
  white-space: nowrap;
}
.pill-good { background: var(--pill-good-bg); color: var(--pill-good-text); border-color: rgba(16,185,129,0.35); }
.pill-warn { background: var(--pill-warn-bg); color: var(--pill-warn-text); border-color: rgba(245,158,11,0.35); }
.pill-bad { background: var(--pill-bad-bg); color: var(--pill-bad-text); border-color: rgba(239,68,68,0.40); }
.pill-purple { background: var(--pill-purple-bg); color: var(--pill-purple-text); border-color: rgba(168,85,247,0.35); }
.pill-ice { background: var(--pill-ice-bg); color: var(--pill-ice-text); border-color: rgba(103,232,249,0.40); }
.pill-neutral { background: var(--card); color: var(--muted); border-color: var(--border); }

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px 14px;
  box-shadow: var(--shadow-card);
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.section-title {
  font-size: var(--fs-sm);
  font-weight: 800;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.input, select {
  width: 100%;
  min-height: 38px;
  background: var(--input-bg);
  color: var(--text);
  border: 1.5px solid var(--border);
  padding: 6px 10px;
  border-radius: var(--r-sm);
  font-size: var(--fs-sm);
}

.fish-strip {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 8px 2px;
  scrollbar-width: thin;
}
.fish-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  background: var(--chip-bg);
  border: 1.5px solid var(--chip-border);
  border-radius: var(--r-md);
  padding: 10px 8px;
  min-width: 156px;
  max-width: 168px;
  flex-shrink: 0;
  cursor: pointer;
  position: relative;
  text-align: center;
  transition: border-color 0.15s ease, transform 0.15s ease;
}
.fish-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.fish-card.active {
  border-color: var(--accent);
  background: rgba(56, 189, 248, 0.12);
  box-shadow: 0 0 0 2px var(--accent);
}
.fish-card.redbook-muted {
  opacity: 0.78;
  border-style: dashed;
  border-color: var(--bad);
}
.fav-btn {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 36px;
  height: 36px;
  border: none;
  background: transparent;
  font-size: 17px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--r-pill);
}
.fish-img-wrap {
  width: 112px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 4px;
}
.fish-img-wrap svg, .fish-img-wrap img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
}
.fish-name {
  font-size: var(--fs-sm);
  font-weight: 800;
  color: var(--text);
  margin-top: 4px;
  line-height: 1.22;
}
.fish-latin {
  font-size: 10px;
  color: var(--muted);
  font-style: italic;
  margin-bottom: 3px;
}
.fish-rating-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  margin-top: 3px;
}
.fish-rating-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
}

.factor-row {
  display: grid;
  grid-template-columns: 165px 1fr 52px;
  align-items: center;
  gap: 10px;
  padding: 5px 0;
  border-bottom: 1px dashed var(--border);
  font-size: var(--fs-sm);
}
.factor-bar-track {
  height: 9px;
  background: var(--input-bg);
  border-radius: var(--r-pill);
  overflow: hidden;
}
.factor-bar-fill {
  height: 100%;
  border-radius: var(--r-pill);
}

.bite-timeline {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  padding-bottom: 6px;
}
.hour-slot {
  flex: 0 0 38px;
  min-width: 38px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  min-height: 78px;
  padding: 5px 2px;
  border-radius: var(--r-sm);
  background: var(--card);
  border: 1.5px solid var(--border);
  cursor: pointer;
  font-size: var(--fs-xs);
}
.hour-slot.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.hour-slot.now { border-color: var(--good); }
.hour-bar-wrap {
  width: 11px;
  height: 34px;
  background: var(--input-bg);
  border-radius: 6px;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
}
.hour-bar { width: 100%; border-radius: 6px; }

.toast-container {
  position: fixed;
  bottom: 78px;
  right: 14px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 330px;
}
.toast {
  background: var(--panel);
  color: var(--text);
  border: 1.5px solid var(--accent);
  border-radius: var(--r-md);
  padding: 10px 12px;
  font-size: var(--fs-sm);
  font-weight: 700;
  box-shadow: var(--shadow-header);
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(2, 6, 23, 0.78);
  z-index: 9000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 14px;
}
.modal-backdrop.open { display: flex; }
.modal-box {
  background: var(--panel);
  border: 1.5px solid var(--border);
  border-radius: var(--r-md);
  max-width: 540px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 16px;
  box-shadow: var(--shadow-header);
}


/* Main application layout & structure */

:root {
  --header-h: 78px;
}

html {
  width: 100%;
}

body {
  width: 100%;
  max-width: 100vw;
  overflow-x: clip;
  padding-top: var(--header-h, 78px);
}

#app, .bottom-nav {
  width: 100%;
  max-width: 100vw;
}

/* Pinned Header: always fixed at top everywhere, dynamically grows with full location name */
.app-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  width: 100%;
  z-index: 1000;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 8px 12px;
  box-shadow: var(--shadow-header);
  height: auto;
}

.header-bar {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  flex-wrap: nowrap;
}

.loc-summary {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
  flex: 1;
}

.loc-sub {
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
  white-space: normal;
  word-break: break-word;
  line-height: 1.25;
}

.loc-main {
  font-size: var(--fs-md);
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  line-height: 1.28;
}

.loc-main-text {
  white-space: normal;
  word-break: break-word;
  overflow: visible;
  text-overflow: clip;
  max-width: 100%;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  align-self: flex-start;
}

/* Compact non-interactive season information strip */
.season-strip {
  max-width: 1200px;
  margin: 5px auto 0;
  padding: 4px 10px;
  min-height: auto;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  border: 1px solid transparent;
  line-height: 1.25;
}
.season-strip.ice-safe { background: var(--pill-ice-bg); color: var(--pill-ice-text); border-color: var(--ice); }
.season-strip.ice-danger { background: var(--pill-bad-bg); color: var(--pill-bad-text); border-color: var(--bad); }
.season-strip.open-water { background: var(--pill-good-bg); color: var(--pill-good-text); border-color: var(--good); }

.app-main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.app-main > section,
.card,
#fcExpressBox,
#fcWeekBox,
#fcHourlyBox {
  width: 100%;
  max-width: 100%;
  min-width: 0;
}

.express-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 10px;
}

.express-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 8px;
  cursor: pointer;
  transition: border-color 0.15s ease, transform 0.15s ease;
}
.express-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.express-card.active { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent); }

.express-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.controls-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 10px;
}

/* Horizontal scroll containers: allow both horizontal swipe (pan-x) and vertical page scroll (pan-y) */
.fish-strip,
.week-strip,
.bite-timeline,
.chip-scroll-row,
.month-grid {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  overflow-x: auto;
  overflow-y: hidden;
  touch-action: pan-x pan-y;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}

/* Smooth progressive miniaturization of fish cards on scroll without empty gap */
.fish-toolbar-onerow {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  width: 100%;
  margin-bottom: 8px;
}

.fish-toolbar-onerow .btn {
  width: 100%;
  min-width: 0;
  padding: 4px 6px;
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.fish-strip-placeholder {
  width: 100%;
  min-width: 0;
}

.fish-strip-dock-wrap {
  width: 100%;
  min-width: 0;
  transition: background-color 0.15s ease, box-shadow 0.15s ease;
}

.fish-strip-dock-wrap.docked-mini {
  position: fixed;
  top: var(--header-h, 78px);
  left: 0;
  right: 0;
  width: 100%;
  z-index: 990;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-header);
  padding: 4px 12px;
}

.fish-strip-dock-wrap.docked-mini .fish-strip {
  max-width: 1200px;
  margin: 0 auto;
  padding: 2px 0;
  gap: 6px;
}

/* Progressive shrinking driven by --shrink (0 to 1) or .docked-mini */
.fish-strip-dock-wrap.docked-mini .fish-card {
  flex-direction: row;
  align-items: center;
  justify-content: flex-start;
  min-width: calc(156px - var(--shrink, 1) * 60px);
  max-width: none;
  padding: calc(10px - var(--shrink, 1) * 6px) 10px calc(10px - var(--shrink, 1) * 6px) 8px;
  gap: 6px;
  border-radius: var(--r-sm);
  transform: none !important;
}

.fish-strip-dock-wrap.docked-mini .fish-img-wrap {
  width: calc(112px - var(--shrink, 1) * 78px);
  height: calc(48px - var(--shrink, 1) * 28px);
  margin: 0;
  flex-shrink: 0;
  transition: width 0.08s linear, height 0.08s linear;
}

.fish-strip-dock-wrap.docked-mini .fish-name {
  font-size: 12px;
  font-weight: 800;
  margin: 0;
  white-space: nowrap;
}

.fish-strip-dock-wrap.docked-mini .fav-btn,
.fish-strip-dock-wrap.docked-mini .fish-latin,
.fish-strip-dock-wrap.docked-mini .fish-badge-wrap,
.fish-strip-dock-wrap.docked-mini .fish-rating-box,
.fish-strip-dock-wrap.docked-mini .fish-redbook-ban,
.fish-strip-dock-wrap.docked-mini [data-info-fish] {
  display: none !important;
}

.week-strip {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 6px;
}

.day-card {
  min-width: 142px;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: var(--r-md);
  padding: 8px 10px;
  flex-shrink: 0;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 5px;
  position: relative;
}
.day-card.active { border-color: var(--accent); background: rgba(56, 189, 248, 0.11); box-shadow: 0 0 0 1.5px var(--accent); }
.day-card.archive-day { border-style: dashed; background: rgba(148, 163, 184, 0.08); }

.day-status-stripe {
  height: 4px;
  width: 100%;
  border-radius: 3px;
}

.month-grid {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.month-cell {
  flex: 1 0 54px;
  min-width: 54px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 7px 4px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.month-cell.current { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent); }

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--panel);
  border-top: 1px solid var(--border);
  z-index: 1000;
  box-shadow: var(--shadow-header);
}

.bottom-nav-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  padding: 4px 6px;
}

.nav-tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 42px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  border-radius: var(--r-sm);
  cursor: pointer;
  padding: 3px 2px;
}
.nav-tab.active {
  color: var(--accent);
  background: rgba(56, 189, 248, 0.12);
}

#mapBox {
  width: 100%;
  height: 290px;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: #0f172a;
  position: relative;
  z-index: 1;
  isolation: isolate;
  overflow: hidden;
}

/* Map 4-chips row: exactly 1 line across any phone screen */
.map-layers-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);

const listeners = new Map();

const events = {
  on(event, fn) {
    if (!listeners.has(event)) listeners.set(event, new Set());
    listeners.get(event).add(fn);
    return () => this.off(event, fn);
  },
  off(event, fn) {
    if (listeners.has(event)) listeners.get(event).delete(fn);
  },
  emit(event, payload) {
    if (!listeners.has(event)) return;
    for (const fn of listeners.get(event)) {
      try { fn(payload); } catch (err) { console.error(`[events] Error in ${event}:`, err); }
    }
  }
};

function detectBasinByCoords(lat, lon) {
  // Expanded black_azov box to lon >= 32.5 so Sevastopol (33.52) and Western Crimea match black_azov
  if (lat >= 41.0 && lat <= 47.8 && lon >= 32.5 && lon <= 41.5) return 'black_azov';
  if (lat >= 54.0 && lat <= 60.5 && lon >= 19.0 && lon <= 31.0) return 'baltic';
  if (lat >= 65.0 && lon >= 30.5 && lon <= 55.0) return 'barents_white';
  if (lat >= 60.5 && lat < 66.5 && lon >= 29.0 && lon <= 38.0) return 'nw_karelia';
  if (lon >= 130.0 && lat >= 42.0) return 'pacific_sea';
  if (lon >= 118.0 && lon < 141.0 && lat >= 47.0 && lat < 55.5) return 'amur';
  if (lat >= 51.0 && lat <= 56.5 && lon >= 103.0 && lon <= 112.0) return 'baikal';
  if (lon >= 88.0 && lon < 135.0 && lat >= 52.0) return 'yenisei_lena';
  if (lat >= 63.0 && lon >= 64.0 && lon < 88.0) return 'arctic_ob_taz';
  if (lon < 37.0 && lat < 56.0) return 'euro_west';
  return 'volga_caspian';
}

function isCoastalInBasin(basinCode, lat, lon) {
  if (!BASIN_CONFIGS[basinCode]?.hasSea) return false;

  switch (basinCode) {
    case 'arctic_ob_taz':
      // Salekhard / Lower Ob delta & Ob Gulf (lat >= 66.45, lon 66..74.5) OR Taz/Kara coast (lat >= 67.2)
      // Explicitly excludes inland Novy Urengoy (66.08, 76.68), Nadym (65.53, 72.52), Noyabrsk, Surgut
      return (lat >= 66.45 && lon >= 66.0 && lon <= 74.5) || (lat >= 67.2 && lon >= 66.0 && lon <= 84.0);

    case 'yenisei_lena':
      // Only Arctic estuary / Yenisei Gulf / Laptev coast (Dudinka / Dikson / Tiksi, lat >= 69.0)
      // Excludes Krasnoyarsk (56.01, 92.87) and Yakutsk
      return lat >= 69.0;

    case 'nw_karelia':
      // White Sea Karelian coast (lat >= 63.8 && lon >= 34.0) or Gulf of Finland (lat <= 61.0 && lon <= 30.8)
      // Excludes inland Petrozavodsk (61.78, 34.35)
      return (lat >= 63.8 && lon >= 34.0) || (lat <= 61.0 && lon <= 30.8);

    case 'volga_caspian':
      // Caspian coast & Lower Volga delta (Astrakhan, Makhachkala, Derbent, Kaspiysk)
      return lat <= 46.8 && lon >= 46.5 && lon <= 51.5;

    case 'black_azov':
      // Black & Azov Sea coast (Crimea, Sevastopol, Sochi, Novorossiysk, Kerch, Taganrog, Yeisk)
      return lat <= 47.4 && lon >= 32.5 && lon <= 40.5;

    case 'baltic':
      // Kaliningrad & Gulf of Finland
      return (lon <= 23.0) || (lat >= 59.5 && lon >= 27.5 && lon <= 30.6);

    case 'barents_white':
    case 'pacific_sea':
      return true;

    default:
      return false;
  }
}

function getAvailableWaterTypes(basinCode, lat, lon) {
  const coastal = isCoastalInBasin(basinCode, lat, lon);
  return Object.entries(WATER_PROFILES)
    .filter(([, prof]) => coastal || !prof.isSea)
    .map(([id, prof]) => ({ id, ...prof }));
}

function getRegionalWatersFallback(basinCode, lat, lon) {
  const coastal = isCoastalInBasin(basinCode, lat, lon);
  const base = [
    { label: '🌊 Малая / средняя река рядом', name: 'Малая река', wType: 'small_river', defDepth: 1.4, distKm: 1.2 },

function calcHaversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = ((lat2 - lat1) * Math.PI) / 180;
  const dLon = ((lon2 - lon1) * Math.PI) / 180;
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLon / 2) ** 2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * 10) / 10;
}

function getNearestRussianWaters(lat, lon, basinCode, isCoastal, maxCount = 8) {
  const calculated = RUSSIA_WATERS.map(w => {
    const distKm = calcHaversine(lat, lon, w.lat, w.lon);
    let penalty = 0;
    if (w.basin !== basinCode) penalty += 500;
    if (!isCoastal && (w.wType === 'sea_gulf' || w.wType === 'open_sea')) penalty += 2000;
    return {
      ...w,
      distKm,
      sortScore: distKm + penalty
    };
  });

  calculated.sort((a, b) => a.sortScore - b.sortScore);
  const top = calculated.slice(0, maxCount);

  return top.map(w => {
    const isRiver = w.name.startsWith('р.');
    const prefix = isRiver ? '🌊 ' : (w.wType.startsWith('sea') ? '⚓ ' : '💧 ');
    const distStr = w.distKm < 1 ? `${Math.round(w.distKm * 1000)} м` : `${w.distKm} км`;
    return {
      name: w.cleanName,
      label: `${prefix}${w.name} • ${distStr} (${w.region})`,
      wType: w.wType,
      defDepth: w.defDepth,
      distKm: w.distKm,
      lat: w.lat,
      lon: w.lon
    };
  });
}

const DB_NAME = 'KlevProDB_v2';
const DB_VERSION = 1;
let dbPromise = null;
const memoryFallback = { catches: [], spots: [] };

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve) => {
    if (typeof indexedDB === 'undefined') {
      resolve(null);
      return;
    }
    try {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('catches')) {
          const cs = db.createObjectStore('catches', { keyPath: 'id' });
          cs.createIndex('fishId', 'fishId', { unique: false });
          cs.createIndex('timestamp', 'timestamp', { unique: false });
        }
        if (!db.objectStoreNames.contains('spots')) {
          db.createObjectStore('spots', { keyPath: 'id' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    } catch (e) {
      resolve(null);
    }
  });
  return dbPromise;
}

const storage = {
  loadSettings() {
    try {
      const raw = localStorage.getItem(STATE_CACHE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  },

  saveSettings(state) {
    try {
      const persist = {
        hasUserLocation: state.hasUserLocation,
        lat: state.lat,
        lon: state.lon,
        locCountry: state.locCountry,
        locAdmin1: state.locAdmin1,
        locAdmin2: state.locAdmin2,
        locLabel: state.locLabel,
        basinCode: state.basinCode,
        basinName: state.basinName,
        isCoastal: state.isCoastal,
        water: state.water,
        selectedWaterName: state.selectedWaterName,
        method: state.method,
        selectedBait: state.selectedBait,
        depth: state.depth,
        fishId: state.fishId,
        showAllSpecies: state.showAllSpecies,
        onlyFavoritesFilter: state.onlyFavoritesFilter,
        favorites: state.favorites,
        compareSpeciesIds: state.compareSpeciesIds,
        theme: state.theme,
        userProfile: state.userProfile
      };
      localStorage.setItem(STATE_CACHE_KEY, JSON.stringify(persist));
    } catch (e) {}
  },

  loadWeatherCache(lat, lon) {
    try {
      const raw = localStorage.getItem(WEATHER_CACHE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      const dist = Math.hypot((parsed.lat || 0) - lat, (parsed.lon || 0) - lon);
      if (dist > 0.15 || !parsed.days || parsed.days.length !== 12) return null;
      const ageMs = Date.now() - (parsed.timestamp || 0);
      return {
        ...parsed,
        isExpired: ageMs > WEATHER_TTL_MS,
        ageMinutes: Math.max(1, Math.round(ageMs / 60000))
      };
    } catch (e) {
      return null;
    }
  },

  saveWeatherCache(lat, lon, payload) {
    try {
      localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify({
        lat,
        lon,
        timestamp: Date.now(),
        ...payload
      }));
    } catch (e) {}
  },

  async getAllFromStore(storeName) {
    const db = await openDB();
    if (!db) return [...(memoryFallback[storeName] || [])];
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([...(memoryFallback[storeName] || [])]);
      } catch (e) {
        resolve([...(memoryFallback[storeName] || [])]);
      }
    });
  },

  async putToStore(storeName, item) {
    const list = memoryFallback[storeName] || [];
    const idx = list.findIndex(x => x.id === item.id);
    if (idx >= 0) list[idx] = item; else list.unshift(item);
    const db = await openDB();
    if (!db) return item;
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).put(item);
        tx.oncomplete = () => resolve(item);
        tx.onerror = () => resolve(item);
      } catch (e) {
        resolve(item);
      }
    });
  },

  async deleteFromStore(storeName, id) {
    memoryFallback[storeName] = (memoryFallback[storeName] || []).filter(x => x.id !== id);
    const db = await openDB();
    if (!db) return true;
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(id);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      } catch (e) {
        resolve(false);
      }
    });
  }
};


function createStore(initialState) {
  let state = { ...initialState };
  const subscribers = new Set();

  function getState() {
    return state;
  }

  function dispatch(action) {
    const prev = state;
    const next = reducer(state, action);
    if (next === prev) return;
    state = next;
    storage.saveSettings(state);

    for (const sub of subscribers) {
      try {
        const prevSlice = sub.selector ? sub.selector(prev) : prev;
        const nextSlice = sub.selector ? sub.selector(state) : state;
        if (!shallowEqual(prevSlice, nextSlice)) {
          sub.callback(state, prev);
        }
      } catch (err) {
        console.error('[store] subscriber error:', err);
      }
    }
  }

  function subscribe(selectorOrCb, maybeCb) {
    const sub = typeof maybeCb === 'function'
      ? { selector: selectorOrCb, callback: maybeCb }
      : { selector: null, callback: selectorOrCb };
    subscribers.add(sub);
    return () => subscribers.delete(sub);
  }

  return { getState, dispatch, subscribe };
}

function shallowEqual(a, b) {
  if (Object.is(a, b)) return true;
  if (typeof a !== 'object' || a === null || typeof b !== 'object' || b === null) return false;
  const keysA = Object.keys(a);
  const keysB = Object.keys(b);
  if (keysA.length !== keysB.length) return false;
  for (const k of keysA) {
    if (!Object.is(a[k], b[k])) return false;
  }
  return true;
}

function reducer(state, action) {
  switch (action.type) {
    case 'SET_ROUTE':
      return { ...state, route: action.payload };
    case 'SET_THEME':
      return { ...state, theme: action.payload };
    case 'SET_LOCATION': {
      const { lat, lon, locCountry, locAdmin1, locAdmin2, locLabel, hasUserLocation } = action.payload;
      const basinCode = detectBasinByCoords(lat, lon);
      const basinName = BASIN_CONFIGS[basinCode]?.name || 'Водный бассейн РФ';
      const isCoastal = isCoastalInBasin(basinCode, lat, lon);
      let water = state.water;
      if (!isCoastal && (water === 'sea_gulf' || water === 'open_sea')) {
        water = 'small_river';
      }
      return {
        ...state,
        hasUserLocation: hasUserLocation ?? true,
        lat,
        lon,
        locCountry: locCountry ?? state.locCountry,
        locAdmin1: locAdmin1 ?? state.locAdmin1,
        locAdmin2: locAdmin2 ?? state.locAdmin2,
        locLabel: locLabel ?? state.locLabel,
        basinCode,
        basinName,
        isCoastal,
        water,
        selectedWaterName: '',
        dayIdx: 2 // Today
      };
    }
    case 'SET_LOCATION_LABELS':
      return { ...state, ...action.payload };
    case 'SET_WATER':
      return {
        ...state,
        water: action.payload.water,
        depth: action.payload.depth ?? state.depth,
        selectedWaterName: action.payload.selectedWaterName ?? state.selectedWaterName
      };
    case 'SET_METHOD':
      return { ...state, method: action.payload };
    case 'SET_BAIT':
      return { ...state, selectedBait: action.payload };
    case 'SET_DEPTH':
      return { ...state, depth: action.payload };
    case 'SET_FISH': {
      const nextFishId = action.payload;
      const fishObj = FISH_DB.find(f => f.id === nextFishId) || FISH_DB[0];
      const compat = getCompatibleMethods(fishObj, state.iceState, state.water);
      const nextMethod = compat.some(m => m.val === state.method)
        ? state.method
        : (compat[0]?.val || state.method);
      return { ...state, fishId: nextFishId, method: nextMethod };
    }
    case 'SET_DAY':
      return { ...state, dayIdx: action.payload };
    case 'SET_HOUR':
      return { ...state, selectedHour: action.payload };
    case 'TOGGLE_SHOW_ALL':
      return { ...state, showAllSpecies: !state.showAllSpecies };
    case 'TOGGLE_ONLY_FAVORITES':
      return { ...state, onlyFavoritesFilter: !state.onlyFavoritesFilter };
    case 'SET_FAVORITES_LIST':
      return { ...state, favorites: action.payload };
    case 'SET_FISH_SEARCH':
      return { ...state, fishSearch: action.payload };
    case 'SET_FISH_GROUP':
      return { ...state, fishGroup: action.payload };
    case 'TOGGLE_FAVORITE': {
      const id = action.payload;
      const exists = state.favorites.includes(id);
      const favorites = exists ? state.favorites.filter(x => x !== id) : [id, ...state.favorites];
      return { ...state, favorites };
    }
    case 'TOGGLE_PIN_DAY': {
      const idx = action.payload;
      let pinned = [...state.pinnedDays];
      if (pinned.includes(idx)) pinned = pinned.filter(x => x !== idx);
      else if (pinned.length < 3) pinned.push(idx);
      else pinned = [pinned[1], pinned[2], idx];
      return { ...state, pinnedDays: pinned };
    }
    case 'SET_CALENDAR_MODE':
      return { ...state, calendarMode: action.payload };
    case 'TOGGLE_COMPARE_SPECIES': {
      const fid = action.payload;
      let list = [...state.compareSpeciesIds];
      if (list.includes(fid)) {
        if (list.length > 1) list = list.filter(x => x !== fid);
      } else if (list.length < 3) {
        list.push(fid);
      } else {
        list = [list[1], list[2], fid];
      }
      return { ...state, compareSpeciesIds: list };
    }
    case 'SET_WEATHER_DATA':
      return {
        ...state,
        weatherDays: action.payload.days,
        elevation: action.payload.elevation ?? state.elevation,
        normPress: action.payload.normPress ?? state.normPress,
        iceState: action.payload.iceState ?? state.iceState,
        iceThickness: action.payload.iceThickness ?? state.iceThickness,
        weatherSource: action.payload.source ?? state.weatherSource,
        weatherUpdatedAt: action.payload.updatedAt ?? Date.now()
      };
    case 'SET_NEARBY_WATERS':
      return { ...state, nearbyWaters: action.payload };
    case 'SET_NEARBY_PLACES':
      return { ...state, nearbyPlaces: action.payload };
    case 'SET_SAVED_SPOTS':
      return { ...state, savedSpots: action.payload };
    case 'SET_CATCHES':
      return { ...state, catches: action.payload };
    case 'SAVE_ONBOARDING':
      return {
        ...state,
        water: action.payload.water,
        method: action.payload.method,
        fishId: action.payload.fishId || state.fishId,
        favorites: Array.from(new Set([...(action.payload.targetSpecies || []), ...state.favorites])),
        userProfile: {
          onboarded: true,
          preferredWater: action.payload.water,
          preferredMethod: action.payload.method,
          targetSpecies: action.payload.targetSpecies || []
        }
      };
    default:
      return state;
  }
}

const saved = storage.loadSettings() || {};

const initCoastal = isCoastalInBasin(initBasin, initLat, initLon);

if (!initCoastal && (initWater === 'sea_gulf' || initWater === 'open_sea')) {
  initWater = 'small_river';
}

const store = createStore({
  ...DEFAULT_STATE,
  ...saved,
  dayIdx: 2, // Always start on Today (idx=2)
  basinCode: initBasin,
  basinName: BASIN_CONFIGS[initBasin]?.name || DEFAULT_STATE.basinName,
  isCoastal: initCoastal,
  water: initWater
});


const VALID_ROUTES = ['dashboard', 'fish', 'geo', 'weather', 'forecast', 'calendar', 'log'];

const router = {
  init() {
    window.addEventListener('hashchange', () => this.syncFromHash());
    this.syncFromHash();
  },

  syncFromHash() {
    const raw = (window.location.hash || '').replace(/^#\/?/, '').trim();
    const route = VALID_ROUTES.includes(raw) ? raw : 'dashboard';
    if (store.getState().route !== route) {
      store.dispatch({ type: 'SET_ROUTE', payload: route });
    }
    this.applyVisibility(route);
  },

  navigate(route) {
    const target = VALID_ROUTES.includes(route) ? route : 'dashboard';
    if (window.location.hash !== `#/${target}`) {
      history.replaceState(null, '', `#/${target}`);
    }
    store.dispatch({ type: 'SET_ROUTE', payload: target });
    this.applyVisibility(target);
  },

  applyVisibility(route) {
    document.querySelectorAll('[data-route-section]').forEach(sec => {
      const secName = sec.getAttribute('data-route-section');
      if (route === 'dashboard' || secName === route) {
        sec.style.display = '';
      } else if (secName === 'fish' && ['forecast', 'weather', 'calendar'].includes(route)) {
        // Keep fish section in DOM so its .fish-card buttons dock in miniature mode
        sec.style.display = '';
      } else {
        sec.style.display = 'none';
      }
    });
    document.querySelectorAll('[data-nav-tab]').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-nav-tab') === route);
    });
    if (typeof window.syncFishDockState === 'function') {
      window.syncFishDockState();
    }
    if (route === 'geo' || route === 'dashboard') {
      setTimeout(() => {
        const box = document.getElementById('mapBox');
        if (box && box.offsetParent !== null) {
          renderMap(box);
        }
      }, 80);
    }
  }
};


async function fetchWithTimeout(url, ms = 6800, options = {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(url, {
      ...options,
      signal: ctrl.signal
    });
    clearTimeout(timer);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch (err) {
    clearTimeout(timer);
    throw err;
  }
}

async function retry(fn, attempts = 2, delayMs = 350) {
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    try {
      return await fn(i);
    } catch (err) {
      lastErr = err;
      if (i < attempts - 1) {
        await new Promise(r => setTimeout(r, delayMs));
      }
    }
  }
  throw lastErr;
}

async function fallbackChain(steps) {
  let lastErr = null;
  for (const step of steps) {
    try {
      if (step.onStart) step.onStart();
      const result = await step.run();
      if (result !== null && result !== undefined) {
        return { data: result, source: step.name || 'online' };
      }
    } catch (err) {
      lastErr = err;
    }
  }
  throw lastErr || new Error('All fallback endpoints failed');
}

  return `${y}-${m}-${d}`;

function fmtHM(floatHr) {

function fmtTemp(t) {

function fmtDeltaPress(dp) {

function pluralize(n, one, few, many) {
  const abs = Math.abs(n) % 100;
  const n1 = abs % 10;
  if (abs > 10 && abs < 20) return many;
  if (n1 > 1 && n1 < 5) return few;
  if (n1 === 1) return one;
  return many;
}

function generateSpawnICS(fish, basinName, shiftWeeks = 0) {
  const year = new Date().getFullYear();
  const months = fish.spawnMonth && fish.spawnMonth.length ? fish.spawnMonth : [5];
  const startMonth = months[0];
  const endMonth = months[months.length - 1];
  const shiftDays = shiftWeeks * 7;

  const startDt = new Date(Date.UTC(year, startMonth - 1, 1 + shiftDays));
  const endDt = new Date(Date.UTC(year, endMonth, 1 + shiftDays));
  const fmtICSDate = (d) => d.toISOString().slice(0, 10).replace(/-/g, '');

  return [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//KlevPRO 2.0//Ichthyology Calendar RU//RU',
    'BEGIN:VEVENT',
    `UID:spawn-${fish.id}-${year}@klevpro.local`,
    `DTSTAMP:${fmtICSDate(new Date())}T080000Z`,
    `DTSTART;VALUE=DATE:${fmtICSDate(startDt)}`,
    `DTEND;VALUE=DATE:${fmtICSDate(endDt)}`,
    `SUMMARY:Нерестовый период / Ограничение: ${fish.name}`,
    `DESCRIPTION:Бассейн: ${basinName}. Статус: ${fish.banMonths}. Региональный сдвиг: ${shiftWeeks > 0 ? '+' + shiftWeeks : shiftWeeks} нед.`,
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
}

  let runningWT = Math.max(0.2, Math.min(25, dailyMeans[0] * 0.52 + 2.5));
  for (let k = 0; k < startIdx; k++) {
    const tgt = Math.max(0.2, Math.min(25, dailyMeans[k] * 0.52 + 2.5));

    const dt = new Date(dStr + 'T00:00:00');
    const srD = new Date(data.daily.sunrise[i]);
    const ssD = new Date(data.daily.sunset[i]);
    const hours = [];
    let sumP = 0;
    for (let h = 0; h < 24; h++) {
      const g = i * 24 + h;
      const pMm = allP[g] || 754;
      sumP += pMm;
      hours.push({
        hour: h,
        tAir: Math.round((data.hourly.temperature_2m[g] ?? 0) * 10) / 10,
        press: Math.round(pMm),
        dp3h: Math.round((pMm - (g >= 3 ? allP[g - 3] : pMm)) * 10) / 10,
        wind: Math.round((data.hourly.wind_speed_10m[g] ?? 3) * 10) / 10,
        windDir: DIRS[Math.round(((data.hourly.wind_direction_10m[g] || 0) / 45)) % 8],
        cloud: data.hourly.cloud_cover[g] ?? 50,
        precip: data.hourly.precipitation[g] ?? 0

    }
    const pAvg = Math.round(sumP / 24);
    const prevAvg = i > 0
      ? Math.round(allP.slice((i - 1) * 24, i * 24).reduce((a, b) => a + b, 0) / 24)

    const tMax = Math.round(data.daily.temperature_2m_max[i]);

      tDay: tMax,
      tNight: tMin,
      pressAvg: pAvg,
      dP: pAvg - prevAvg,
      windMax: Math.round(data.daily.wind_speed_10m_max[i] || 3),
      windDir: DIRS[Math.round(((data.daily.wind_direction_10m_dominant[i] || 0) / 45)) % 8],
      sunriseHr: srD.getHours() + srD.getMinutes() / 60,

function normalizeMetNo(metNo, lat, waterType) {
  const fb = buildFallback(lat, waterType);
  const coords = metNo.geometry?.coordinates || [];
  const elevation = Math.round(coords[2] || 90);
  const normPress = Math.round(760 - elevation / 11.5);
  const byDate = {};
  for (const item of (metNo.properties?.timeseries || [])) {
    const dt = new Date(item.time);
    const dStr = formatLocalYYYYMMDD(dt);
    const hr = dt.getHours();
    if (!byDate[dStr]) byDate[dStr] = {};
    const inst = item.data?.instant?.details || {};
    const pSea = inst.air_pressure_at_sea_level || 1013.25;
    const pMm = pSea * 0.750062 - elevation / 11.5;
    byDate[dStr][hr] = {
      hour: hr,
      tAir: Math.round((inst.air_temperature ?? 0) * 10) / 10,
      press: Math.round(pMm),
      dp3h: 0,
      wind: Math.round((inst.wind_speed ?? 3) * 10) / 10,
      windDir: DIRS[Math.round(((inst.wind_from_direction || 0) / 45)) % 8],
      cloud: Math.round(inst.cloud_area_fraction ?? 50),
      precip: item.data?.next_1_hours?.details?.precipitation_amount ?? 0
    };
  }
  fb.days.forEach((dayObj, i) => {
    const mapH = byDate[dayObj.date];
    if (mapH) {
      let last = Object.values(mapH)[0];
      for (let h = 0; h < 24; h++) {
        if (mapH[h]) last = mapH[h];
        else if (last) mapH[h] = { ...last, hour: h };
        if (mapH[h]) dayObj.hours[h] = mapH[h];
      }
      for (let h = 0; h < 24; h++) {
        const prevP = h >= 3 ? dayObj.hours[h - 3].press : dayObj.hours[0].press;
        dayObj.hours[h].dp3h = Math.round((dayObj.hours[h].press - prevP) * 10) / 10;
      }
      const tArr = dayObj.hours.map(x => x.tAir);
      const pArr = dayObj.hours.map(x => x.press);
      const wArr = dayObj.hours.map(x => x.wind);
      dayObj.tDay = Math.round(Math.max(...tArr));
      dayObj.tNight = Math.round(Math.min(...tArr));
      dayObj.pressAvg = Math.round(pArr.reduce((a, b) => a + b, 0) / 24);
      dayObj.dP = i > 0 ? (dayObj.pressAvg - fb.days[i - 1].pressAvg) : 0;
      dayObj.windMax = Math.round(Math.max(...wArr));
      dayObj.windDir = dayObj.hours[12].windDir;
    }
  });
  return {
    days: fb.days,
    elevation,
    normPress,
    iceState: fb.days[2]?.iceState || fb.days[0].iceState,
    iceThickness: fb.days[2]?.iceThickness || 0

}

function clamp(val, min, max) {

function calcHaversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = ((lat2 - lat1) * Math.PI) / 180;
  const dLon = ((lon2 - lon1) * Math.PI) / 180;
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLon / 2) ** 2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * 10) / 10;
}

async function setLocation(lat, lon, skipReverseGeo = false) {

async function resolveReverseGeocode(lat, lon) {
  // Check offline cities first if close (< 25 km)
  for (const c of RUSSIA_CITIES) {
    if (calcHaversineKm(lat, lon, c.lat, c.lon) <= 25) {
      store.dispatch({
        type: 'SET_LOCATION_LABELS',
        payload: {
          locCountry: 'Россия',
          locAdmin1: c.admin1,
          locAdmin2: c.name,
          locLabel: c.name
        }
      });
      return;
    }
  }

  try {
    const nomUrl = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&addressdetails=1&zoom=12&accept-language=ru`;
    const nom = await fetchWithTimeout(nomUrl, 5500, { headers: { 'Accept-Language': 'ru' } });
    if (nom && nom.address) {
      const a = nom.address;
      const city = a.city || a.town || a.village || a.hamlet || a.municipality || a.county || nom.name || '';
      const reg = a.state || a.region || '';
      if (city || reg) {
        store.dispatch({
          type: 'SET_LOCATION_LABELS',
          payload: {
            locCountry: a.country || 'Россия',
            locAdmin1: reg,
            locAdmin2: city,
            locLabel: city || reg
          }
        });
        return;
      }
    }
  } catch (e) {}

  try {
    const bdcUrl = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ru`;
    const data = await fetchWithTimeout(bdcUrl, 5500);
    if (data && (data.city || data.locality || data.principalSubdivision)) {
      const city = data.city || data.locality || data.principalSubdivision;
      store.dispatch({
        type: 'SET_LOCATION_LABELS',
        payload: {
          locCountry: data.countryName || 'Россия',
          locAdmin1: data.principalSubdivision || '',
          locAdmin2: city,
          locLabel: city
        }
      });
      return;
    }
  } catch (e) {}

  store.dispatch({
    type: 'SET_LOCATION_LABELS',
    payload: {
      locCountry: 'Россия',
      locAdmin1: `${lat.toFixed(2)}°N`,
      locAdmin2: `${lon.toFixed(2)}°E`,
      locLabel: `${lat.toFixed(2)}°N, ${lon.toFixed(2)}°E`
    }
  });
}

      const seenWater = new Set(offlineWaters.map(w => w.name.toLowerCase()));
      const seenPlace = new Set();
      const waters = [...offlineWaters];
      const places = [];

      for (const el of (data.elements || [])) {
        const name = el.tags && (el.tags['name:ru'] || el.tags.name);
        if (!name) continue;
        const elLat = el.lat ?? el.center?.lat;
        const elLon = el.lon ?? el.center?.lon;
        const distKm = (elLat && elLon) ? calcHaversineKm(lat, lon, elLat, elLon) : 9.9;

        if (el.tags.place) {
          const key = name.toLowerCase();
          if (seenPlace.has(key)) continue;
          seenPlace.add(key);
          if (elLat && elLon) {
            places.push({ name, lat: elLat, lon: elLon, distKm });
          }
          continue;
        }

        const cleanName = name.replace(/^(река|озеро|пруд|ручей)\s+/i, '');
        const wKey = cleanName.toLowerCase();
        if (seenWater.has(wKey)) continue;
        seenWater.add(wKey);

        const isRiver = Boolean(el.tags.waterway);
        let wType = isRiver
          ? (/обь|иртыш|енисей|волга|кама|дон|днепр|пур|таз|амур|лена|ангара|печора|ока|урал|вятка|кубань|нева|свирь/i.test(name) ? 'big_river' : 'small_river')
          : (/море|губа|залив|лиман|бухта/i.test(name) ? (s.isCoastal ? 'sea_gulf' : 'quarry') : (/карьер|вдхр|водохранилище/i.test(name) ? 'quarry' : 'tundra_lake'));
        const defDepth = WATER_PROFILES[wType]?.defD || 1.5;
        const prefix = isRiver ? '🌊 р. ' : '💧 ';

        waters.push({
          name: cleanName,
          label: `${prefix}${cleanName} • ${distKm} км`,
          wType,
          defDepth,
          distKm,
          lat: elLat || lat,
          lon: elLon || lon
        });
      }

      waters.sort((a, b) => a.distKm - b.distKm);
      places.sort((a, b) => a.distKm - b.distKm);

      if (places.length > 0) {
        store.dispatch({ type: 'SET_NEARBY_PLACES', payload: places.slice(0, 8) });
      }
      if (waters.length > 0) {
        const topWaters = waters.slice(0, 10);
        store.dispatch({ type: 'SET_NEARBY_WATERS', payload: topWaters });
        return topWaters;
      }
    } catch (e) {}
  }

  return offlineWaters;
}

async function saveSpot(customName = '') {
  const s = store.getState();
  const wTitle = s.selectedWaterName || WATER_PROFILES[s.water]?.shortName || s.water;
  const spot = {
    id: `spot_${Date.now()}`,
    name: (customName || '').trim() || `${s.locLabel} (${wTitle})`,
    lat: s.lat,
    lon: s.lon,
    basinCode: s.basinCode,
    water: s.water,
    selectedWaterName: s.selectedWaterName,
    depth: s.depth,
    createdAt: new Date().toISOString()
  };
  await storage.putToStore('spots', spot);
  const all = await storage.getAllFromStore('spots');
  store.dispatch({ type: 'SET_SAVED_SPOTS', payload: all });
  showToast(`⭐ Точка «${spot.name}» сохранена в закладки! Найти её можно в блоке «Карта и водоём» в строке «Сохранённые точки».`, 'good');
  return spot;
}

async function deleteSpot(id) {
  await storage.deleteFromStore('spots', id);
  const all = await storage.getAllFromStore('spots');
  store.dispatch({ type: 'SET_SAVED_SPOTS', payload: all });
}

function renderMap(mapBoxEl) {
  if (!mapBoxEl || typeof L === 'undefined') return;
  const s = store.getState();
  const targetZoom = mapInstance ? clamp(mapInstance.getZoom(), 9, 13) : 10;
  if (!mapInstance || mapInstance._container !== mapBoxEl) {
    if (mapInstance) {
      try { mapInstance.remove(); } catch (e) {}
    }
    mapInstance = L.map(mapBoxEl).setView([s.lat, s.lon], targetZoom);
    mapInstance.attributionControl.setPrefix(false);
    const cfg = MAP_LAYERS[currentLayerKey] || MAP_LAYERS.topo;
    currentTileLayer = L.tileLayer(cfg.url, { maxZoom: 18, attribution: cfg.attr }).addTo(mapInstance);
    mapMarker = L.marker([s.lat, s.lon]).addTo(mapInstance);
    mapInstance.on('click', (e) => {
      setLocation(e.latlng.lat, e.latlng.lng);
    });
  } else {
    mapInstance.invalidateSize();
    mapMarker.setLatLng([s.lat, s.lon]);
    mapInstance.setView([s.lat, s.lon], targetZoom);
  }
}

function bindGeoEvents(container, showDrawer) {
  const toggleBtn = container.querySelector('#geoToggleMapBtn');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      mapOpen = !mapOpen;
      render(container);
    });
  }

  const gpsBtn = container.querySelector('#geoGpsBtn');
  if (gpsBtn) gpsBtn.addEventListener('click', () => requestGPS(container));

  const saveSpotBtn = container.querySelector('#geoSaveSpotBtn');
  if (saveSpotBtn) saveSpotBtn.addEventListener('click', () => saveSpot());

  const searchBtn = container.querySelector('#geoSearchBtn');
  const searchInput = container.querySelector('#geoSearchInput');
  if (searchBtn && searchInput) {
    searchBtn.addEventListener('click', () => searchPlaceByQuery(searchInput.value));
    searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') searchPlaceByQuery(searchInput.value); });
  }

  container.querySelectorAll('[data-map-layer]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLayerKey = btn.getAttribute('data-map-layer');
      if (mapInstance) {
        if (currentTileLayer) mapInstance.removeLayer(currentTileLayer);
        const cfg = MAP_LAYERS[currentLayerKey] || MAP_LAYERS.topo;
        currentTileLayer = L.tileLayer(cfg.url, { maxZoom: 18, attribution: cfg.attr }).addTo(mapInstance);
      }
      render(container);
    });
  });

  container.querySelectorAll('[data-nearby-place]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [latStr, lonStr, name] = btn.getAttribute('data-nearby-place').split(',');
      store.dispatch({ type: 'SET_LOCATION_LABELS', payload: { locLabel: name, locAdmin2: name } });
      setLocation(parseFloat(latStr), parseFloat(lonStr), true);
    });
  });

  container.querySelectorAll('[data-nearby-water]').forEach(btn => {
    btn.addEventListener('click', () => {
      const wType = btn.getAttribute('data-nearby-water');
      const wName = btn.getAttribute('data-nearby-name') || '';
      const defD = parseFloat(btn.getAttribute('data-nearby-depth')) || WATER_PROFILES[wType]?.defD || 1.5;
      store.dispatch({ type: 'SET_WATER', payload: { water: wType, depth: defD, selectedWaterName: wName } });
      showToast(`Выбран водоём: ${wName}`, 'info');
    });
  });

  container.querySelectorAll('[data-load-spot]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-load-spot');
      const sp = store.getState().savedSpots.find(x => x.id === id);
      if (sp) {
        store.dispatch({ type: 'SET_LOCATION_LABELS', payload: { locLabel: sp.name } });
        store.dispatch({ type: 'SET_WATER', payload: { water: sp.water, depth: sp.depth, selectedWaterName: sp.selectedWaterName || '' } });
        setLocation(sp.lat, sp.lon, true);
      }
    });
  });

  container.querySelectorAll('[data-del-spot]').forEach(btn => {
    btn.addEventListener('click', () => deleteSpot(btn.getAttribute('data-del-spot')));
  });

  const wSel = container.querySelector('#geoWaterSelect');
  if (wSel) {
    wSel.addEventListener('change', (e) => {
      const wType = e.target.value;
      const prof = WATER_PROFILES[wType] || WATER_PROFILES.small_river;
      const clampedDepth = clamp(store.getState().depth, prof.minD, prof.maxD);
      store.dispatch({ type: 'SET_WATER', payload: { water: wType, depth: clampedDepth, selectedWaterName: '' } });
    });
  }

  const mSel = container.querySelector('#geoMethodSelect');
  if (mSel) {
    mSel.addEventListener('change', (e) => {
      store.dispatch({ type: 'SET_METHOD', payload: e.target.value });
    });
  }

  const dRange = container.querySelector('#geoDepthRange');
  const dVal = container.querySelector('#geoDepthVal');
  if (dRange) {
    dRange.addEventListener('input', (e) => { if (dVal) dVal.textContent = parseFloat(e.target.value).toFixed(1); });
    dRange.addEventListener('change', (e) => {
      store.dispatch({ type: 'SET_DEPTH', payload: parseFloat(e.target.value) });
    });
  }

  if (showDrawer) {
    setTimeout(() => {
      const box = container.querySelector('#mapBox');
      if (box) renderMap(box);
    }, 60);
  }
}

const { setLocation, autoDetectStartupLocation, getNearbyWatersAndPlaces, saveSpot, renderMap, getMethodOptions } = geoModule;


const forecastModule = (() => {
function computeHourFactors(fish, day, hrObj, method, water, depth, normPress = 752, globalIceState = 'open_water') {
  const dayIce = day.iceState || globalIceState;
  if (fish.legal === 'redbook') {
    return { total: 0, forbidden: true, iceDanger: false, factors: [] };
  }
  if (dayIce === 'ice_danger' && !method.startsWith('winter_')) {
    return { total: 8, forbidden: false, iceDanger: true, factors: [] };
  }

  const wt = day.waterTemp ?? 8;
  const [tOptMin, tOptMax] = fish.tWaterOpt || [8, 16];
  let tempDelta = 0;
  let tempNote = `Вода ${wt}°C (оптимум ${tOptMin}–${tOptMax}°C)`;
  if (wt < fish.tMinStop) {
    tempDelta = -36;
    tempNote = `Вода ${wt}°C ниже порога активности (${fish.tMinStop}°C) — оцепенение`;
  } else if (wt >= tOptMin && wt <= tOptMax) {
    tempDelta = +16;
    tempNote = `Вода ${wt}°C в оптимуме вида (${tOptMin}–${tOptMax}°C)`;
  } else if (wt < tOptMin) {
    const span = Math.max(1.5, tOptMin - fish.tMinStop);
    const ratio = (wt - fish.tMinStop) / span;
    const coldBoost = (fish.coldFactor || 0.7) >= 1.05 ? 6 : 0;
    tempDelta = Math.round(-18 + ratio * 28 + coldBoost);
    tempNote = `Вода ${wt}°C прохладнее оптимума (${tOptMin}–${tOptMax}°C)`;
  } else {
    const excess = wt - tOptMax;
    tempDelta = Math.max(-30, Math.round(12 - excess * 7));
    tempNote = `Вода ${wt}°C теплее оптимума (${tOptMin}–${tOptMax}°C)`;
  }

  // Pressure calculations - strengthened for barometric breakdown
  const pDiff = Math.abs((hrObj.press || 754) - normPress);
  const dp = hrObj.dp3h ?? (day.dP / 4);
  let pressDelta = Math.round(6 - Math.min(14, pDiff * 0.6 * (fish.bladderSens || 0.8)));

  if (fish.type === 'predator') {
    if (dp <= -0.8) pressDelta += 8;
    else if (dp >= 1.0) pressDelta -= 9;
  } else {
    if (Math.abs(dp) <= 0.6) pressDelta += 6;
    else if (dp <= -1.0) pressDelta -= 8;
  }

  // Severe daily jump impact (barometric stress on swim bladder)
  const absDailyDP = Math.abs(day.dP || 0);
  if (absDailyDP >= 8) {
    pressDelta -= 18;
  } else if (absDailyDP >= 5) {
    pressDelta -= 12;
  }

  pressDelta = Math.max(-24, Math.min(15, pressDelta));
  const pressNote = `Давление ${hrObj.press} мм (суточный ход ${fmtDeltaPress(day.dP)})`;

  // Wind calculations
  let windDelta = 0;
  if (dayIce === 'ice_safe') {
    windDelta = hrObj.wind > 9 ? -8 : +3;
  } else if (fish.id === 'burbot') {
    windDelta = (hrObj.wind >= 4 || hrObj.precip > 0) ? +10 : 0;
  } else {
    if (hrObj.wind >= 1.5 && hrObj.wind <= 5.5) windDelta += 6;
    else if (hrObj.wind >= 8.5) windDelta -= 16;
    else if (hrObj.wind > 6.5) windDelta -= 8;
    else windDelta -= 2;

    if (['Ю', 'ЮЗ', 'З'].includes(hrObj.windDir)) windDelta += 4;
    else if (['С', 'СВ', 'В'].includes(hrObj.windDir)) windDelta -= 4;
  }
  const windNote = `Ветер ${hrObj.windDir} ${hrObj.wind} м/с`;

  // Seasonal and spawn
  const dtMonthIdx = new Date(day.date + 'T00:00:00').getMonth();
  const curMonthNum = dtMonthIdx + 1;
  const mAct = (fish.monthActivity && fish.monthActivity[dtMonthIdx]) ?? 2;
  let seasonDelta = mAct === 3 ? +14 : (mAct === 2 ? +6 : (mAct === 1 ? -6 : -18));
  if (fish.spawnMonth && fish.spawnMonth.includes(curMonthNum)) {
    seasonDelta = -22;
  }
  if (dayIce === 'ice_safe' && ['crucian', 'carp', 'tench', 'catfish', 'tilapia', 'silver_carp', 'grass_carp', 'snakehead'].includes(fish.id)) {
    seasonDelta = -28;
  }
  const seasonNote = fish.spawnMonth?.includes(curMonthNum)
    ? 'Период нереста — кормовая активность снижена'
    : `Сезонный биоритм месяца: ${mAct} из 3`;

  // Gear & Depth
  let gearDelta = 0;
  if (depth > fish.depthMax) {
    gearDelta -= 22;
  } else if (depth >= fish.depthOpt[0] && depth <= fish.depthOpt[1]) {
    gearDelta += 8;
  } else {
    gearDelta -= 6;
  }
  gearDelta += getMethodCompatibility(fish, method);

  const h = hrObj.hour;
  const sr = day.sunriseHr ?? 7;
  const ss = day.sunsetHr ?? 18;
  const isTwilight = Math.abs(h + 0.5 - sr) <= 1.5 || Math.abs(h + 0.5 - ss) <= 1.5;
  const isDay = (h + 0.5 >= sr - 0.5) && (h + 0.5 <= ss + 0.5);
  if (fish.feedMode === 'nocturnal') gearDelta += !isDay ? 6 : (isTwilight ? 2 : -10);
  else if (fish.feedMode === 'crepuscular') gearDelta += isTwilight ? 7 : (isDay ? 2 : -8);
  else if (fish.feedMode === 'diurnal') gearDelta += isDay ? 5 : -12;
  gearDelta = Math.max(-22, Math.min(16, gearDelta));
  const gearNote = `Глубина ${depth} м (оптимум ${fish.depthOpt[0]}–${fish.depthOpt[1]} м)`;

  // Moon
  const md = day.moon?.moonDay || 10;
  let moonDelta = 0;
  if (md >= 28 || md <= 2 || (md >= 14 && md <= 17)) moonDelta += 3;
  else if ((md >= 6 && md <= 8) || (md >= 21 && md <= 23)) moonDelta -= 3;
  const dTr = Math.min(Math.abs(h - (day.moon?.transitHour || 12)), 24 - Math.abs(h - (day.moon?.transitHour || 12)));
  if (dTr <= 1.5) moonDelta += 2;
  const moonNote = `${day.moon?.phaseName || 'Луна'} (${md} л.д.)`;

  const baseScore = 52;
  const rawTotal = baseScore + tempDelta + pressDelta + windDelta + seasonDelta + gearDelta + moonDelta;
  const total = Math.max(4, Math.min(98, Math.round(rawTotal)));

  return {
    total,
    forbidden: false,
    iceDanger: false,
    factors: [
      { id: 'temp', name: 'Температура воды', val: tempDelta, note: tempNote },
      { id: 'press', name: 'Давление и его ход', val: pressDelta, note: pressNote },
      { id: 'season', name: 'Сезонный биоритм', val: seasonDelta, note: seasonNote },
      { id: 'gear', name: 'Глубина, свет и снасть', val: gearDelta, note: gearNote },
      { id: 'wind', name: 'Ветер и волнение', val: windDelta, note: windNote },
      { id: 'moon', name: 'Фаза Луны', val: moonDelta, note: moonNote }
    ]
  };
}

function getMethodCompatibility(fish, method) {
  if (method === 'winter_livebait') return fish.type === 'predator' ? 7 : -14;
  if (method === 'winter_lure') return ['perch', 'pike', 'zander', 'grayling', 'smelt', 'trout', 'cod', 'navaga', 'lenok', 'volga_zander', 'char', 'broad_whitefish', 'saffron_cod'].includes(fish.id) ? 8 : -10;
  if (method === 'winter_jig') return ['chir', 'pizhyan', 'peled', 'cisco', 'roach', 'perch', 'whitefish', 'ruffe', 'smelt', 'bream', 'ide', 'dace', 'white_bream', 'vendace', 'omul', 'omul_arctic', 'valek', 'baikal_grayling'].includes(fish.id) ? 8 : -5;
  if (method === 'winter_stuka') return ['burbot', 'cod', 'halibut', 'navaga', 'wolffish'].includes(fish.id) ? 10 : -12;
  if (method === 'winter_cisco') return ['cisco', 'peled', 'smelt', 'whitefish', 'herring', 'vendace', 'omul', 'omul_arctic'].includes(fish.id) ? 10 : -10;
  if (method === 'spin_micro') return ['perch', 'roach', 'crucian', 'rudd', 'bleak', 'chub', 'grayling', 'trout', 'brown_trout', 'rainbow_trout', 'rotan', 'gudgeon', 'dace', 'ide', 'horse_mackerel', 'sea_bass', 'scorpionfish', 'wrasse'].includes(fish.id) ? 8 : (fish.type === 'predator' ? 3 : -6);
  if (method === 'spin_jig') return ['zander', 'pike', 'perch', 'catfish', 'volga_zander', 'amur_catfish', 'channel_catfish', 'burbot', 'cod', 'halibut', 'greenling'].includes(fish.id) ? 8 : (fish.type === 'predator' ? 4 : -14);
  if (method === 'spin_lure') return fish.type === 'predator' ? 7 : -12;
  if (method === 'bottom') return (fish.type === 'peace' || ['catfish', 'burbot', 'channel_catfish', 'amur_catfish', 'ruffe', 'flounder', 'starry_flounder', 'turbot', 'plaice', 'goby'].includes(fish.id)) ? 8 : -7;
  if (method === 'float') return (fish.type === 'peace' || ['perch', 'rotan', 'ruffe', 'chub', 'grayling', 'trout', 'dolly_varden', 'garfish'].includes(fish.id)) ? 7 : -6;
  if (method === 'fly') return ['grayling', 'baikal_grayling', 'lenok', 'salmon', 'trout', 'chub', 'ide', 'tugun', 'dace', 'brown_trout', 'sockeye_salmon', 'char', 'dolly_varden', 'bleak', 'rudd', 'chekhon'].includes(fish.id) ? 9 : -10;
  if (method.startsWith('sea_')) return fish.habitat === 'sea' ? 8 : -12;
  return 0;
}

function calcHourly(fish, day, hrObj, method, water, depth, normPress = 752, iceState = 'open_water') {
  return computeHourFactors(fish, day, hrObj, method, water, depth, normPress, iceState).total;
}

function calcDayBest(fish, day, method, water, depth, normPress = 752, iceState = 'open_water') {
  if (!fish || fish.legal === 'redbook' || !day?.hours?.length) return 0;
  const scores = day.hours.map(hr => calcHourly(fish, day, hr, method, water, depth, normPress, iceState)).sort((a, b) => b - a);
  return Math.round((scores[0] + scores[1] + scores[2] + scores[3]) / 4);
}

function getFactorBreakdown(fish, day, method, water, depth, normPress = 752, iceState = 'open_water', hourIdx = null) {
  if (!day || !day.hours?.length) return { total: 0, factors: [] };
  let targetHr = day.hours[12];
  if (hourIdx !== null && day.hours[hourIdx]) {
    targetHr = day.hours[hourIdx];
  } else {
    let bestSc = -1;
    for (const hr of day.hours) {
      const sc = calcHourly(fish, day, hr, method, water, depth, normPress, iceState);
      if (sc > bestSc) { bestSc = sc; targetHr = hr; }
    }
  }
  return computeHourFactors(fish, day, targetHr, method, water, depth, normPress, iceState);
}

function calcDynamicRig(method, water, depth, wind) {
  const prof = WATER_PROFILES[water] || WATER_PROFILES.small_river;
  const flowCoeff = prof.flow;
  if (method === 'winter_jig') return { weight: `Вольфрамовая мормышка ${Math.min(3.5, Math.max(0.4, Math.round(depth * 0.35 * flowCoeff * 10) / 10))} г`, line: 'Зимняя леска 0.09–0.12 мм', tactic: 'Плавный подъём с мелкой игрой на 30–50 см от дна и короткой паузой' };
  if (method === 'winter_cisco') return { weight: 'Нижнее грузило 6–14 г + гирлянда', line: 'Основная леска 0.14 мм, поводки 0.10 мм', tactic: 'Плавное покачивание гирлянды мормышек в полводы и у кромки льда' };
  if (method === 'winter_lure') return { weight: `Балансир / Раттлин ${Math.min(32, Math.max(5, Math.round(depth * 2.0 * flowCoeff)))} г`, line: 'Плетёный шнур 0.14 мм + флюорокарбон 0.35 мм', tactic: 'Короткий взмах удильником на 15–20 см, сброс и выдержка паузы 4–6 секунд' };
  if (method === 'winter_stuka') return { weight: `Блесна-стукалка ${Math.min(65, Math.max(20, Math.round(depth * 3.5 * flowCoeff)))} г`, line: 'Монолеска 0.35–0.45 мм', tactic: 'Ритмичное постукивание по каменистому дну с подсадкой кусочка рыбы' };
  if (method === 'winter_livebait') return { weight: `Скользящее грузило ${Math.max(6, Math.round(depth * 1.6 * flowCoeff))} г`, line: 'Леска 0.35 мм + поводок 0.45 мм / металл', tactic: 'Установка живца в 25–40 см от дна на бровке или у камыша' };
  if (method === 'spin_micro') return { weight: `Груз-чебурашка / Мормышка ${Math.min(4.5, Math.max(0.3, Math.round(depth * 0.65 * flowCoeff * 10) / 10))} г`, line: 'Тонкий шнур 0.06–0.08 мм + поводок 0.12–0.14 мм', tactic: 'Мелкая анимация кончиком удилища в придонном слое с паузами до 3 секунд' };
  if (method === 'spin_jig') return { weight: `Джиг-головка ${Math.min(56, Math.max(8, Math.round(depth * 2.8 * flowCoeff)))} г`, line: 'Плетёный шнур 0.14–0.18 мм + поводок', tactic: 'Классическая ступенька: два оборота катушки — пауза 2 секунды с касанием дна' };
  if (method === 'spin_lure') return { weight: `Блесна / Воблер ${Math.min(28, Math.max(4, Math.round(depth * 2.2 * flowCoeff)))} г`, line: 'Шнур 0.12–0.16 мм + стальной/титановый поводок', tactic: 'Равномерная проводка вдоль кромки травы или рывковая анимация с паузами' };
  if (method === 'bottom') return { weight: `Донная кормушка ${Math.min(130, Math.max(25, Math.round(depth * 12 * flowCoeff)))} г`, line: 'Шнур 0.14 мм, поводок 0.12–0.18 мм (50–70 см)', tactic: 'Точное закармливание точки на ракушечнике или нижней русловой бровке' };
  if (method === 'float') return { weight: `Поплавок ${Math.min(8.0, Math.max(0.5, Math.round((depth * 0.8 * flowCoeff + wind * 0.15) * 10) / 10))} г`, line: 'Основная леска 0.14–0.16 мм, поводок 0.10–0.12 мм', tactic: 'Проводка насадки в придонном слое с лёгким притормаживанием поплавка' };
  if (method === 'fly') return { weight: 'Нахлыстовый шнур 4–5 класса + подлесок 2.7 м', line: 'Поводковая леска 0.12–0.16 мм', tactic: 'Подача мушки вверх или поперёк струи со свободным проплывом без борозды' };
  return { weight: `Морское грузило / Блесна ${Math.max(12, Math.round(depth * 3.8 * flowCoeff))} г`, line: 'Шнур 0.14–0.20 мм + флюорокарбоновый поводок', tactic: 'Ступенчатая проводка у каменистого рельефа и береговых свалов' };
}

function renderExpress(container) {
  if (!container) return;
  const s = store.getState();
  const fish = FISH_DB.find(f => f.id === s.fishId) || FISH_DB[0];
  const expressIndices = [2, 3, 4]; // Сегодня, Завтра, Послезавтра
  const curTheme = document.documentElement.getAttribute('data-theme') || 'dark';

  const cardsHtml = expressIndices.map((dayIdx, pos) => {
    const d = s.weatherDays[dayIdx];
    if (!d) return '';
    const dayName = pos === 0 ? 'Сегодня' : (pos === 1 ? 'Завтра' : 'Послезавтра');
    const score = calcDayBest(fish, d, s.method, s.water, s.depth, s.normPress, s.iceState);
    const dayIce = d.iceState || s.iceState;

    const wtOk = d.waterTemp >= fish.tWaterOpt[0] && d.waterTemp <= fish.tWaterOpt[1];
    const wtTone = d.waterTemp < fish.tMinStop ? 'bad' : (wtOk ? 'good' : 'warn');
    const pTone = Math.abs(d.dP) <= 2 ? 'good' : (Math.abs(d.dP) <= 4 ? 'warn' : 'bad');
    const wTone = d.windMax <= 5 ? 'good' : (d.windMax <= 8 ? 'warn' : 'bad');
    const iceTone = dayIce === 'ice_danger' ? 'bad' : (dayIce === 'ice_safe' ? 'ice' : 'good');
    const iceText = dayIce === 'ice_danger' ? `Опасный лёд ~${d.iceThickness} см` : (dayIce === 'ice_safe' ? `Лёд ~${d.iceThickness} см` : 'Открытая вода');

    // Adverse weather conditions check
    const isPressJump = Math.abs(d.dP) >= 5;
    const isGale = d.windMax >= 8.5;
    const isIceDanger = dayIce === 'ice_danger';

    let verdict = RU.verdictGo;
    let verdictTone = 'good';
    let customRatingWord = null;

    if (fish.legal === 'redbook') {
      verdict = RU.verdictBan;
      verdictTone = 'bad';
    } else if (isIceDanger) {
      verdict = `⚠️ Опасный лёд (~${d.iceThickness} см)`;
      verdictTone = 'bad';
      customRatingWord = 'Выход на лёд опасен';
    } else if (isPressJump) {
      verdict = `⚠️ Скачок давления (${d.dP > 0 ? '+' : ''}${d.dP} мм)`;
      verdictTone = Math.abs(d.dP) >= 8 ? 'bad' : 'warn';
      customRatingWord = score < 35 ? 'Клёва нет' : (score < 50 ? 'Слабый клёв' : 'Умеренный клёв • Нестабильно');
    } else if (isGale) {
      verdict = `⚠️ Штормовой ветер (${d.windMax} м/с)`;
      verdictTone = 'bad';
      customRatingWord = score < 35 ? 'Клёва нет' : 'Слабый клёв • Шторм';
    } else if (score < 38) {
      verdict = RU.verdictStay;
      verdictTone = 'bad';
    } else if (score < 60) {
      verdict = RU.verdictCareful;
      verdictTone = 'warn';
      customRatingWord = 'Умеренный клёв';
    }

    const bd = getFactorBreakdown(fish, d, s.method, s.water, s.depth, s.normPress, s.iceState);
    const topNotes = bd.factors.slice(0, 2).map(f => `${f.note} (${f.val >= 0 ? '+' + f.val : f.val}%)`).join('; ');

    return `
      <div class="card express-card ${s.dayIdx === dayIdx ? 'active' : ''}" data-express-day="${dayIdx}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
          <div>
            <div style="font-size:var(--fs-md);font-weight:800;">${dayName} • ${d.label}</div>
            <div style="font-size:var(--fs-xs);color:var(--muted);">Объект лова: <b>${fish.name}</b></div>
          </div>
          ${createPill({ text: verdict, tone: verdictTone })}
        </div>
        <div class="express-chips">
          ${createPill({ icon: '💧', text: `Вода ${d.waterTemp}°C`, tone: wtTone })}
          ${createPill({ icon: '🧭', text: `${d.pressAvg} мм (${fmtDeltaPress(d.dP)})`, tone: pTone })}
          ${createPill({ icon: '💨', text: `${d.windDir} ${d.windMax} м/с`, tone: wTone })}
          ${createPill({ icon: d.moon.phaseIcon, text: `${d.moon.moonDay} л.д.`, tone: 'neutral' })}
          ${createPill({ icon: dayIce === 'open_water' ? '🌊' : '❄️', text: iceText, tone: iceTone })}
        </div>
        <p style="font-size:var(--fs-xs);color:var(--muted);line-height:1.38;">
          ${fish.legal === 'redbook'
            ? RU.redbookLaw
            : (dayIce === 'ice_danger'
                ? '⚠️ Выход на тонкий лёд смертельно опасен! Допустима только береговая ловля.'
                : `${topNotes}.`)}
        </p>
        <div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--border);gap:8px;">
          <div>
            ${fish.legal === 'redbook'
              ? `<span class="pill pill-bad">${RU.redbookBan}</span>`
              : renderFiveFish(score, 16, curTheme, true, customRatingWord)}
          </div>
          ${dayIdx === 2
            ? `<button type="button" class="btn btn-sm btn-good" data-catch-today="2">🎣 Я поймал</button>`
            : `<span style="font-size:10px;color:var(--muted);font-weight:700;">Прогноз</span>`}
        </div>
      </div>
    `;
  }).join('');

  container.innerHTML = `
    <div>
      <div class="section-head">
        <span class="section-title">⚡ Экспресс-сводка (3 дня)</span>
        <span style="font-size:var(--fs-xs);color:var(--muted);">Клик по карточке открывает почасовой разбор дня</span>
      </div>
      <div class="express-grid">${cardsHtml}</div>
    </div>
  `;
}

function clampHour(h) {
  const n = parseInt(h, 10);
  return Number.isFinite(n) ? Math.max(0, Math.min(23, n)) : 12;
}

function bindForecastEvents(container) {
  container.querySelectorAll('[data-express-day]').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('[data-catch-today]')) return;
      const idx = parseInt(card.getAttribute('data-express-day'), 10);
      store.dispatch({ type: 'SET_DAY', payload: idx });
    });
  });

  const catchTodayBtn = container.querySelector('[data-catch-today]');
  if (catchTodayBtn) {
    catchTodayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      store.dispatch({ type: 'SET_DAY', payload: 2 });
      const s = store.getState();
      events.emit('forecast:hourSelected', { dayIdx: 2, hour: s.selectedHour, bait: s.selectedBait });
    });
  }

  container.querySelectorAll('[data-week-day]').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('[data-pin-day]')) return;
      const idx = parseInt(card.getAttribute('data-week-day'), 10);
      store.dispatch({ type: 'SET_DAY', payload: idx });
    });
  });

  container.querySelectorAll('[data-pin-day]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.getAttribute('data-pin-day'), 10);
      store.dispatch({ type: 'TOGGLE_PIN_DAY', payload: idx });
    });
  });

  container.querySelectorAll('[data-scrub-hour]').forEach(btn => {
    btn.addEventListener('click', () => {
      const hr = parseInt(btn.getAttribute('data-scrub-hour'), 10);
      store.dispatch({ type: 'SET_HOUR', payload: hr });
    });
  });

  const baitSel = container.querySelector('#fcSeasonalBaitSel');
  if (baitSel) {
    baitSel.addEventListener('change', (e) => {
      store.dispatch({ type: 'SET_BAIT', payload: e.target.value });
    });
  }

  // Reactive dependency chain in Archive logger
  const archFish = container.querySelector('#archFishSel');
  const archMethod = container.querySelector('#archMethodSel');
  const archBait = container.querySelector('#archBaitSel');

  if (archFish) {
    archFish.addEventListener('change', (e) => {
      const newFishId = e.target.value;
      const s = store.getState();
      const fObj = FISH_DB.find(x => x.id === newFishId) || FISH_DB[0];
      store.dispatch({ type: 'SET_FISH', payload: newFishId });

      // Update methods for this fish
      const newMethods = getCompatibleMethods(fObj, s.iceState, s.water);
      if (archMethod) {
        archMethod.innerHTML = newMethods.map(m => `<option value="${m.val}">${m.text}</option>`).join('');
        const chosenMethod = newMethods[0]?.val;
        store.dispatch({ type: 'SET_METHOD', payload: chosenMethod });

        // Update baits
        const day = s.weatherDays[s.dayIdx] || s.weatherDays[2] || s.weatherDays[0] || {};
        const newBaits = getSeasonalBaitsForContext(fObj, chosenMethod, day.waterTemp ?? 12, day.iceState || s.iceState);
        if (archBait) {
          archBait.innerHTML = newBaits.map(b => `<option value="${b}">${b}</option>`).join('');
          store.dispatch({ type: 'SET_BAIT', payload: newBaits[0] || '' });
        }
      }
    });
  }

  if (archMethod) {
    archMethod.addEventListener('change', (e) => {
      const chosenMethod = e.target.value;
      store.dispatch({ type: 'SET_METHOD', payload: chosenMethod });
      const s = store.getState();
      const fObj = FISH_DB.find(x => x.id === s.fishId) || FISH_DB[0];
      const day = s.weatherDays[s.dayIdx] || s.weatherDays[2] || s.weatherDays[0] || {};
      const newBaits = getSeasonalBaitsForContext(fObj, chosenMethod, day.waterTemp ?? 12, day.iceState || s.iceState);
      if (archBait) {
        archBait.innerHTML = newBaits.map(b => `<option value="${b}">${b}</option>`).join('');
        store.dispatch({ type: 'SET_BAIT', payload: newBaits[0] || '' });
      }
    });
  }

  if (archBait) {
    archBait.addEventListener('change', (e) => {
      store.dispatch({ type: 'SET_BAIT', payload: e.target.value });
    });
  }

  const archHour = container.querySelector('#archHourSel');
  if (archHour) {
    archHour.addEventListener('change', (e) => {
      store.dispatch({ type: 'SET_HOUR', payload: parseInt(e.target.value, 10) });
    });
  }

  const archWater = container.querySelector('#archWaterSel');
  if (archWater) {
    archWater.addEventListener('change', (e) => {
      const [wType, wName] = e.target.value.split('|');
      store.dispatch({ type: 'SET_WATER', payload: { water: wType, selectedWaterName: wName } });
    });
  }

  const archBtn = container.querySelector('#archOpenCatchBtn');
  if (archBtn) {
    archBtn.addEventListener('click', () => {
      const s = store.getState();
      const chosenBait = container.querySelector('#archBaitSel')?.value || s.selectedBait;
      events.emit('forecast:hourSelected', {
        dayIdx: s.dayIdx,
        hour: s.selectedHour,
        fishId: s.fishId,
        bait: chosenBait
      });
    });
  }
}

let searchDebounceTimer = null;

function pickBestDefaultFish(regionalList) {
  const list = regionalList && regionalList.length ? regionalList : FISH_DB;
  const curMonth = new Date().getMonth();
  const sorted = [...list]
    .filter(f => f.legal !== 'redbook')
    .sort((a, b) => (b.monthActivity[curMonth] || 0) - (a.monthActivity[curMonth] || 0));
  return sorted[0]?.id || list[0]?.id || 'pike';
}

function getFilteredFishList(state) {
  const s = state || store.getState();
  // Regional fauna check: Caucasian Black Sea mountain streams (Sochi, Mzymta, Matsesta)
  const isCaucasianMountainStream = s.basinCode === 'black_azov' &&
    s.lat <= 44.6 && s.lat >= 43.3 && s.lon >= 38.5 && s.lon <= 40.5 &&
    (s.water === 'small_river' || (s.selectedWaterName || '').toLowerCase().includes('мзымта'));

  let list = s.showAllSpecies
    ? [...FISH_DB]
    : FISH_DB.filter(f => {
        const basinMatch = f.basins.includes(s.basinCode);
        let waterMatch = !f.waters || f.waters.includes(s.water);
        if (!waterMatch && (s.water === 'tundra_lake' || s.water === 'quarry') && ['crucian', 'carp', 'silver_carp', 'grass_carp', 'perch', 'pike', 'roach', 'bream'].includes(f.id)) {
          waterMatch = true;
        }
        if (f.legal === 'introduced' && s.water !== 'cooling_reservoir' && s.water !== 'quarry') {
          if (!['carp', 'silver_carp', 'grass_carp'].includes(f.id)) return false;
        }
        // In rapid Caucasian mountain rivers (Mzymta, etc.), pike, perch and zander do not live; trout, chub, barbel, goby dominate
        if (isCaucasianMountainStream && ['pike', 'perch', 'zander', 'bream'].includes(f.id)) {
          return false;
        }
        return basinMatch && waterMatch;
      });

  if (s.onlyFavoritesFilter) {
    const favSet = new Set(s.favorites || []);
    list = list.filter(f => favSet.has(f.id));
  }

  if (s.fishGroup && s.fishGroup !== 'all') {
    list = list.filter(f => f.group === s.fishGroup);
  }

  const q = (s.fishSearch || '').trim().toLowerCase();
  if (q) {
    list = list.filter(f => f.name.toLowerCase().includes(q) || (f.latin || '').toLowerCase().includes(q));
  }

  const favSet = new Set(s.favorites || []);
  list.sort((a, b) => {
    const aFav = favSet.has(a.id) ? 1 : 0;
    const bFav = favSet.has(b.id) ? 1 : 0;
    return bFav - aFav;
  });

  return list;
}
