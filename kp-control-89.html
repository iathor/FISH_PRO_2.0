          contourColor: 'rgba(0, 245, 212, 0.12)',
          outerRingColor: '#00f5d4',
          gridColor: 'rgba(0, 245, 212, 0.42)',
          degreeColor: 'rgba(251, 191, 36, 0.88)',
          beamColorRgb: [0, 245, 212],
          fishIdleColor: 'rgba(245, 158, 11, 0.24)',
          fishLitColor: '#fef08a',
          fishGlowColor: '#fbbf24',
          hexCoreBg: 'rgba(15, 23, 42, 0.72)',
          hexCoreBorder: 'rgba(0, 245, 212, 0.45)'
        },
        light: {
          id: 'light',
          bgGrad: ['#f6fafe', '#dfeaf5'],
          contourColor: 'rgba(2, 132, 199, 0.11)',
          outerRingColor: '#0284c7',
          gridColor: 'rgba(2, 132, 199, 0.32)',
          degreeColor: 'rgba(3, 105, 161, 0.78)',
          beamColorRgb: [14, 165, 233],
          fishIdleColor: 'rgba(2, 132, 199, 0.22)',
          fishLitColor: '#ffffff',
          fishGlowColor: '#0284c7',
          hexCoreBg: 'rgba(255, 255, 255, 0.55)',
          hexCoreBorder: 'rgba(2, 132, 199, 0.32)'
        }
      };

      // Определение ориентации по платформе:
      // - Смартфоны (APK, PWA, мобильный сайт, Telegram Mini App): строго вертикально ('portrait')
      // - Планшеты: вертикально или горизонтально в зависимости от текущего поворота экрана
      // - Десктоп / ноутбук: строго горизонтально ('landscape')
      function detectSplashPlatformOrient() {
        var ua = navigator.userAgent || '';
        var w = window.innerWidth || 390;
        var h = window.innerHeight || 844;
        var minSide = Math.min(w, h);
        var maxSide = Math.max(w, h);
        var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        var isPhoneUa = /iPhone|iPod|Windows Phone|Android.*Mobile|BlackBerry|IEMobile|Opera Mini/i.test(ua);
        var isTabletUa = /iPad|Tablet|PlayBook|Silk|Android(?!.*Mobile)/i.test(ua);
        var isApk = document.documentElement.getAttribute('data-apk-webview') === '1' || typeof window.AndroidBridge !== 'undefined';

        if (isPhoneUa || minSide < 600 || (isApk && minSide < 600)) {
          return 'portrait';
        }
        if (isTabletUa || (isTouch && minSide >= 600 && maxSide <= 1400)) {
          return w >= h ? 'landscape' : 'portrait';
        }
        return 'landscape';
      }

      // Инициализируем 18 маленьких рыбок внутри сонара
      var baseAngles = [12, 32, 52, 74, 96, 118, 140, 162, 184, 206, 228, 250, 272, 294, 316, 338, 22, 128];
      var baseRadii =  [0.83, 0.64, 0.78, 0.54, 0.85, 0.70, 0.80, 0.58, 0.75, 0.48, 0.86, 0.66, 0.44, 0.56, 0.88, 0.60, 0.72, 0.50];
      var baseSizes =  [1.04, 0.86, 0.92, 0.78, 1.10, 0.82, 1.06, 0.85, 0.90, 0.76, 0.96, 0.88, 0.74, 0.80, 1.00, 0.84, 0.90, 0.78];
      var smallFish = [];
      for (var i = 0; i < SMALL_FISH_COUNT; i++) {
        smallFish.push({
          angleRad: (baseAngles[i % baseAngles.length] * Math.PI) / 180,
          radiusNorm: baseRadii[i % baseRadii.length],
          sizeScale: baseSizes[i % baseSizes.length],
          headingSign: (i % 2 === 0) ? 1 : -1,
          swimSpeed: (0.0022 + (i % 4) * 0.0007) * ((i % 2 === 0) ? 1 : -1),
          depthMeters: (2.4 + (i * 1.3) % 9.5).toFixed(1)
        });
      }

      var vpState = { w: 390, h: 844, dpr: 1, cx: 195, cy: 350, R: 140, orient: 'portrait', themeObj: THEMES.dark };

      function syncSplashLayout() {
        var curThemeAttr = document.documentElement.getAttribute('data-theme') || 'dark';
        var themeObj = THEMES[curThemeAttr] || THEMES.dark;
        var orient = detectSplashPlatformOrient();
        splashEl.setAttribute('data-app-splash-theme', themeObj.id);
        splashEl.setAttribute('data-splash-orient', orient);

        var w = window.innerWidth || 390;
        var h = window.innerHeight || 844;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);

        var cx, cy, R;
        if (orient === 'portrait') {
          cx = w * 0.50;
          cy = h * 0.41;
          R = Math.min(w * 0.42, h * 0.25);
        } else {
          cx = w * 0.70;
          cy = h * 0.50;
          R = Math.min(w * 0.255, h * 0.425);
        }

        vpState.w = w;
        vpState.h = h;
        vpState.dpr = dpr;
        vpState.cx = cx;
        vpState.cy = cy;
        vpState.R = R;
        vpState.orient = orient;
        vpState.themeObj = themeObj;

        if (pikeEl) {
          var pikeDiam = R * 1.54 * (PIKE_SCALE_PCT / 100);
          pikeEl.style.left = cx + 'px';
          pikeEl.style.top = cy + 'px';
          pikeEl.style.width = pikeDiam + 'px';
          pikeEl.style.height = pikeDiam + 'px';
        }
      }

      function drawSmallFish(ctx, x, y, size, dirSign, fillStyle, glowColor, glowStrength) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(dirSign * size, size);
        if (glowStrength > 0.08 && glowColor) {
          ctx.shadowColor = glowColor;
          ctx.shadowBlur = 12 * glowStrength;
        }
        ctx.fillStyle = fillStyle;
        ctx.beginPath();
        ctx.moveTo(11, 0);
        ctx.quadraticCurveTo(4, -5.2, -5, -2.5);
        ctx.lineTo(-11, -6);
        ctx.lineTo(-9, 0);
        ctx.lineTo(-11, 6);
        ctx.lineTo(-5, 2.5);
        ctx.quadraticCurveTo(4, 5.2, 11, 0);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(2, -4.2);
        ctx.lineTo(-2, -7.2);
        ctx.lineTo(-4, -3.5);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawBathymetry(ctx, w, h, cx, cy, R, themeObj) {
        ctx.save();
        ctx.strokeStyle = themeObj.contourColor;
        ctx.lineWidth = 1.25;
        for (var i = 1; i <= 9; i++) {
          var baseR = R * (0.95 + i * 0.24);
          ctx.beginPath();
          for (var a = 0; a <= 64; a++) {
            var ang = (a / 64) * Math.PI * 2;
            var wave = Math.sin(ang * 3 + i * 0.9) * (10 + i * 2.5) + Math.cos(ang * 5 - i * 0.6) * (6 + i * 1.5);
            var r = baseR + wave;
            var px = cx + Math.cos(ang) * r * 1.18;
            var py = cy + Math.sin(ang) * r * 0.94;
            if (a === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.stroke();
        }
        ctx.restore();
      }

      // Непрерывный малый сонар с вращением в обратную сторону (против часовой стрелки)
      function drawMiniSonarCCW(ctx, x, y, r, ccwAngle, themeObj) {
        ctx.save();
        var br = themeObj.beamColorRgb[0], bg = themeObj.beamColorRgb[1], bb = themeObj.beamColorRgb[2];
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = themeObj.id === 'light' ? 'rgba(255, 255, 255, 0.55)' : 'rgba(6, 16, 30, 0.55)';
        ctx.fill();

        ctx.lineWidth = 1.15;
        var rings = [1, 0.68, 0.38];
        for (var k = 0; k < rings.length; k++) {
          ctx.beginPath();
          ctx.arc(x, y, r * rings[k], 0, Math.PI * 2);
          ctx.strokeStyle = k === 0 ? themeObj.outerRingColor : themeObj.gridColor;
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.moveTo(x - r * 0.92, y);
        ctx.lineTo(x + r * 0.92, y);
        ctx.moveTo(x, y - r * 0.92);
        ctx.lineTo(x, y + r * 0.92);
        ctx.strokeStyle = themeObj.gridColor;
        ctx.lineWidth = 0.85;
        ctx.stroke();

        var span = 0.78;
        var steps = 14;
        for (var i = 0; i < steps; i++) {
          var t0 = i / steps;
          var t1 = (i + 1) / steps;
          var a0 = ccwAngle + span * (1 - t1);
          var a1 = ccwAngle + span * (1 - t0);
          var alpha = Math.pow(t1, 1.7) * (themeObj.id === 'light' ? 0.36 : 0.48);
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.arc(x, y, r * 0.94, a0 - 0.01, a1);
          ctx.closePath();
          ctx.fillStyle = 'rgba(' + br + ',' + bg + ',' + bb + ',' + alpha.toFixed(3) + ')';
          ctx.fill();
        }

        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(ccwAngle) * r * 0.94, y + Math.sin(ccwAngle) * r * 0.94);
        ctx.strokeStyle = themeObj.id === 'light' ? '#0284c7' : '#ffffff';
        ctx.lineWidth = 1.6;
        ctx.stroke();

        var blipAngle = -Math.PI * 0.65;
        var diff = (blipAngle - ccwAngle) % (Math.PI * 2);
        if (diff < 0) diff += Math.PI * 2;
        var blipGlow = diff < 1.8 ? Math.pow(1 - diff / 1.8, 1.5) : 0.25;
        ctx.fillStyle = themeObj.id === 'contrast' ? '#fbbf24' : themeObj.outerRingColor;
        ctx.beginPath();
        ctx.arc(x + Math.cos(blipAngle) * r * 0.54, y + Math.sin(blipAngle) * r * 0.54, 2.2 + blipGlow * 1.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      var sweepAngle = -Math.PI / 4;
      var miniSweepAngle = -Math.PI / 3;
      var startTs = performance.now();
      var lastTs = startTs;
      var splashStopped = false;

      function getStatusStageText(pct) {
        if (pct < 24) return 'Инициализация гидролокатора и карт глубин EPSG:3395...';
        if (pct < 50) return 'Синхронизация метеорадара, давления и ледовой обстановки...';
        if (pct < 76) return 'Загрузка ихтиобазы (115 видов рыб и 491 водоём РФ)...';
        if (pct < 96) return 'Проверка спутников GPS/ГЛОНАСС и офлайн-кэша...';
        return 'Система Клёв ПРО 2.0 (v2.9.0) готова к выходу на водоём';
      }

      function renderFrame(now) {
        if (splashStopped) return;
        var dt = Math.min(0.05, (now - lastTs) / 1000);
        lastTs = now;
        var elapsedMs = now - startTs;
        var nowSec = now / 1000;

        sweepAngle = (sweepAngle + dt * 1.45 * SONAR_SPEED_MULT) % (Math.PI * 2);
        miniSweepAngle = (miniSweepAngle - dt * 1.45 * SONAR_SPEED_MULT) % (Math.PI * 2);

        for (var fi = 0; fi < smallFish.length; fi++) {
          smallFish[fi].angleRad = (smallFish[fi].angleRad + smallFish[fi].swimSpeed * dt * 12 + Math.PI * 2) % (Math.PI * 2);
        }

        // Прогресс загрузки до 100% за 6.6 сек (строго до 8 секунд)
        var rawPct = Math.min(100, Math.max(8, (elapsedMs / TOTAL_LOAD_DURATION_MS) * 100));
        if (pctEl) pctEl.textContent = Math.round(rawPct) + '%';
        if (fillEl) fillEl.style.width = rawPct.toFixed(1) + '%';
        if (subEl) subEl.textContent = getStatusStageText(rawPct);

        var ctx = canvas.getContext('2d');
        if (ctx) {
          var w = vpState.w, h = vpState.h, dpr = vpState.dpr, cx = vpState.cx, cy = vpState.cy, R = vpState.R, themeObj = vpState.themeObj;
          ctx.save();
          ctx.scale(dpr, dpr);

          var bgGrad = ctx.createRadialGradient(cx, cy, R * 0.1, cx, cy, Math.max(w, h) * 0.95);
          bgGrad.addColorStop(0, themeObj.bgGrad[0]);
          bgGrad.addColorStop(1, themeObj.bgGrad[1]);
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, w, h);

          drawBathymetry(ctx, w, h, cx, cy, R, themeObj);

          if (vpState.orient === 'portrait') {
            drawMiniSonarCCW(ctx, w * 0.22, h * 0.14, R * 0.25, miniSweepAngle, themeObj);
          } else {
            drawMiniSonarCCW(ctx, cx - R * 0.96, cy - R * 0.74, R * 0.22, miniSweepAngle, themeObj);
          }

          var br = themeObj.beamColorRgb[0], bg = themeObj.beamColorRgb[1], bb = themeObj.beamColorRgb[2];
          var halo = ctx.createRadialGradient(cx, cy, R * 0.72, cx, cy, R * 1.22);
          halo.addColorStop(0, 'rgba(' + br + ',' + bg + ',' + bb + ',0.10)');
          halo.addColorStop(0.7, 'rgba(' + br + ',' + bg + ',' + bb + ',0.04)');
          halo.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = halo;
          ctx.beginPath();
          ctx.arc(cx, cy, R * 1.22, 0, Math.PI * 2);
          ctx.fill();

          if (themeObj.id === 'contrast') {
            var segRings = [
              { r: R * 0.93, w: R * 0.055, color: 'rgba(0, 245, 212, 0.78)', dash: [28, 8] },
              { r: R * 0.83, w: R * 0.050, color: 'rgba(245, 158, 11, 0.82)', dash: [38, 12] },
              { r: R * 0.72, w: R * 0.042, color: 'rgba(217, 119, 6, 0.55)', dash: [24, 10] },
              { r: R * 0.61, w: R * 0.036, color: 'rgba(0, 245, 212, 0.35)', dash: [18, 14] }
            ];
            for (var sri = 0; sri < segRings.length; sri++) {
              var sr = segRings[sri];
              ctx.save();
              ctx.beginPath();
              ctx.strokeStyle = sr.color;
              ctx.lineWidth = sr.w;
              ctx.setLineDash(sr.dash);
              ctx.lineDashOffset = (sri % 2 === 0 ? 1 : -1) * nowSec * 6;
              ctx.arc(cx, cy, sr.r, 0, Math.PI * 2);
              ctx.stroke();
              ctx.restore();
            }
          }

          var ringFracs = [1.0, 0.92, 0.74, 0.54, 0.34];
          for (var rfi = 0; rfi < ringFracs.length; rfi++) {
            ctx.beginPath();
            ctx.arc(cx, cy, R * ringFracs[rfi], 0, Math.PI * 2);
            ctx.strokeStyle = rfi === 1 ? themeObj.outerRingColor : themeObj.gridColor;
            ctx.lineWidth = rfi === 1 ? 2.4 : 1.2;
            ctx.stroke();
          }

          ctx.save();
          var hexR = R * 0.32;
          ctx.beginPath();
          for (var hi = 0; hi < 6; hi++) {
            var ha = (hi * Math.PI) / 3 - Math.PI / 6;
            var hx = cx + Math.cos(ha) * hexR;
            var hy = cy + Math.sin(ha) * hexR;
            if (hi === 0) ctx.moveTo(hx, hy);
            else ctx.lineTo(hx, hy);
          }
          ctx.closePath();
          ctx.fillStyle = themeObj.hexCoreBg;
          ctx.fill();
          ctx.strokeStyle = themeObj.hexCoreBorder;
          ctx.lineWidth = 1.4;
          ctx.stroke();
          ctx.restore();

          ctx.save();
          ctx.strokeStyle = themeObj.gridColor;
          ctx.lineWidth = 1.3;
          ctx.beginPath();
          ctx.moveTo(cx - R * 0.92, cy);
          ctx.lineTo(cx + R * 0.92, cy);
          ctx.moveTo(cx, cy - R * 0.92);
          ctx.lineTo(cx, cy + R * 0.92);
          ctx.stroke();
          ctx.restore();

          ctx.save();
          ctx.fillStyle = themeObj.degreeColor;
          ctx.strokeStyle = themeObj.gridColor;
          var fontSize = Math.max(7, Math.min(11, R * 0.042));
          ctx.font = '700 ' + fontSize + 'px Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          for (var deg = 0; deg < 360; deg += 10) {
            var rad = ((deg - 90) * Math.PI) / 180;
            var tIn = R * 0.925;
            var tOut = R * (deg % 30 === 0 ? 0.955 : 0.942);
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(rad) * tIn, cy + Math.sin(rad) * tIn);
            ctx.lineTo(cx + Math.cos(rad) * tOut, cy + Math.sin(rad) * tOut);
            ctx.stroke();
            var lblR = R * 0.968;
            var lx = cx + Math.cos(rad) * lblR;
            var ly = cy + Math.sin(rad) * lblR;
            ctx.save();
            ctx.translate(lx, ly);
            ctx.rotate(rad + Math.PI / 2);
            ctx.fillText(String(deg), 0, 0);
            ctx.restore();
          }
          ctx.restore();

          // Вращающийся луч сонара (за щукой)
          var sectorSpan = 0.68;
          var steps = 26;
          for (var s = 0; s < steps; s++) {
            var t0 = s / steps;
            var t1 = (s + 1) / steps;
            var a0 = sweepAngle - sectorSpan * (1 - t0);
            var a1 = sweepAngle - sectorSpan * (1 - t1);
            var alpha = Math.pow(t1, 1.9) * (themeObj.id === 'light' ? 0.34 : 0.44);
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, R * 0.92, a0, a1 + 0.008);
            ctx.closePath();
            ctx.fillStyle = 'rgba(' + br + ',' + bg + ',' + bb + ',' + alpha.toFixed(3) + ')';
            ctx.fill();
          }

          ctx.save();
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx + Math.cos(sweepAngle) * R * 0.92, cy + Math.sin(sweepAngle) * R * 0.92);
          ctx.strokeStyle = themeObj.id === 'light' ? '#0284c7' : '#ffffff';
          ctx.lineWidth = 2.2;
          ctx.shadowColor = themeObj.outerRingColor;
          ctx.shadowBlur = 12;
          ctx.stroke();
          ctx.restore();

          // Отрисовка 18 маленьких рыбок в сонаре с подсветкой при проходе луча
          var fishBaseScale = Math.max(0.55, R / 235);
          for (var idx = 0; idx < smallFish.length; idx++) {
            var fish = smallFish[idx];
            var diff = (sweepAngle - fish.angleRad) % (Math.PI * 2);
            if (diff < 0) diff += Math.PI * 2;
            var glow = diff < 2.2 ? Math.pow(1 - diff / 2.2, 1.7) : 0;
            var fx = cx + Math.cos(fish.angleRad) * (R * fish.radiusNorm);
            var fy = cy + Math.sin(fish.angleRad) * (R * fish.radiusNorm);
            var fillCol = glow > 0.15
              ? (themeObj.id === 'light'
                  ? 'rgba(2, 132, 199, ' + (0.35 + glow * 0.65).toFixed(2) + ')'
                  : 'rgba(' + br + ',' + bg + ',' + bb + ',' + (0.35 + glow * 0.65).toFixed(2) + ')')
              : themeObj.fishIdleColor;

            drawSmallFish(
              ctx,
              fx,
              fy,
              fish.sizeScale * fishBaseScale * (1 + glow * 0.18),
              fish.headingSign,
              glow > 0.55 ? themeObj.fishLitColor : fillCol,
              themeObj.fishGlowColor,
              glow
            );

            if (glow > 0.35) {
              ctx.save();
              var ringR = (12 + (1 - glow) * 10) * fishBaseScale;
              ctx.beginPath();
              ctx.arc(fx, fy, ringR, 0, Math.PI * 2);
              ctx.strokeStyle = themeObj.id === 'contrast'
                ? 'rgba(251, 191, 36, ' + (glow * 0.85).toFixed(2) + ')'
                : 'rgba(' + br + ',' + bg + ',' + bb + ',' + (glow * 0.85).toFixed(2) + ')';
              ctx.lineWidth = 1.3;
              ctx.stroke();
              if (glow > 0.55 && R > 110) {
                ctx.font = '800 ' + Math.round(9 * fishBaseScale) + 'px Inter, sans-serif';
                ctx.fillStyle = themeObj.id === 'light' ? '#0369a1' : '#ffffff';
                ctx.fillText(fish.depthMeters + 'м', fx + ringR + 3, fy - 2);
              }
              ctx.restore();
            }
          }

          ctx.restore();
        }

        if (elapsedMs >= 6900) {
          splashStopped = true;
          splashEl.classList.add('splash-hide');
          try { window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; } catch (_e) {}
          return;
        }
        requestAnimationFrame(renderFrame);
      }

      syncSplashLayout();
      window.addEventListener('resize', syncSplashLayout, { passive: true });
      window.addEventListener('orientationchange', function() {
        setTimeout(syncSplashLayout, 50);
      }, { passive: true });
      requestAnimationFrame(renderFrame);

      setTimeout(function() {
        splashStopped = true;
        if (splashEl) splashEl.classList.add('splash-hide');
        try { window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; } catch (_e) {}
      }, 7000);
    })();
  </script>
