plugins {
    id 'com.android.application'
}
def ciRunNum = (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
def effVerCode = 293256 + ciRunNum

android {
    namespace 'ru.klevpro.app'
    compileSdk 34
    defaultConfig {
        applicationId "ru.klevpro.app"
        minSdk 24
        targetSdk 34
        versionCode effVerCode
        versionName "2.9.2-r256"
    }
    signingConfigs {
        release {
            storeFile file("klevpro-release.keystore")
            storePassword System.getenv("KLEV_KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KLEV_KEY_ALIAS") ?: "klevpro"
            keyPassword System.getenv("KLEV_KEY_PASSWORD") ?: (System.getenv("KLEV_KEYSTORE_PASSWORD") ?: "")
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds true
        abortOnError false
    }
    aaptOptions {
        ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }
}
dependencies {
}
