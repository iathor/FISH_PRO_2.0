plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.klevpro.app'
    compileSdk 34

    defaultConfig {
        applicationId System.getenv("KLEV_APP_ID") ?: "ru.klevpro.app"
        minSdk 24
        targetSdk 34
        versionCode 270225
        versionName "2.7.0-r225"
    }

    signingConfigs {
        release {
            storeFile file("klevpro-release.keystore")
            storePassword System.getenv("KLEV_KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KLEV_KEY_ALIAS") ?: "klevpro"
            keyPassword System.getenv("KLEV_KEYSTORE_PASSWORD") ?: ""
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    aaptOptions {
        ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }
}

dependencies {
}
