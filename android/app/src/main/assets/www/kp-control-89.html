.app-main {

}
.app-main > section,
.card,
.bento-card,
#fcExpressBox,
#fcWeekBox,
#fcHourlyBox {
width: 100%;

}
.bento-dashboard-wrap {
display: flex;
flex-direction: column;
gap: 12px;
width: 100%;
}
.bento-card,
.card {
background: linear-gradient(155deg, rgba(24, 45, 72, 0.92) 0%, rgba(12, 25, 44, 0.96) 55%, rgba(8, 17, 31, 0.98) 100%);

[data-theme="light"] .bento-card,

}
[data-theme="contrast"] .bento-card,
[data-theme="contrast"] .card {

}
.bento-card::before,
.card::before {

left: -15%;

height: 100%;

z-index: 0;
}

.bento-card.bento-hero-card {

}
.bento-card.bento-chart-card {

}
.bento-card.bento-radar-card {
border-color: var(--bento-radar-border, rgba(56, 189, 248, 0.38));

}
.bento-card.bento-weather-card {

}
.bento-card-head,
.section-head {

flex-wrap: wrap;

}
.bento-card-title,
.section-title {

font-weight: 900;
color: var(--text);

letter-spacing: 0 !important;
}
.bento-card-sub {

}

.bento-gauge-col {

}

}

}
}

}

}

}

}
.bento-gauge-sub {

.bento-tackle-summary {

}

}

}
}

}

.bento-bottom-duo {

      // 1. Если есть сохранённая в localStorage полная сборка Leaflet 1.9.4 и мы без сети — загружаем мгновенно
      try {
        var cachedJs = localStorage.getItem(LEAFLET_CACHE_KEY);
        if (cachedJs && cachedJs.length > 20000 && navigator.onLine === false) {
          var inlineScript = document.createElement('script');
          inlineScript.textContent = cachedJs;
          document.head.appendChild(inlineScript);
          notifyMapReady();
          return;
        }
      } catch (e) {}

      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = cssUrls[0].url;
      link.onerror = function() {
        link.crossOrigin = 'anonymous';
        link.integrity = cssUrls[1].sri;
        link.href = cssUrls[1].url;
      };
      document.head.appendChild(link);

      function cacheLeafletSourceForOffline(url) {
        try {
          if (localStorage.getItem(LEAFLET_CACHE_KEY)) return;
          fetch(url, { mode: 'cors', credentials: 'omit' })
            .then(function(r) { return r.ok ? r.text() : ''; })
            .then(function(txt) {
              if (txt && txt.length > 20000) {
                try { localStorage.setItem(LEAFLET_CACHE_KEY, txt); } catch (e) {}
              }
            }).catch(function() {});
        } catch (e) {}
      }

      function loadLeafletScript(idx) {
        if (typeof window.L !== 'undefined') {
          notifyMapReady();
          return;
        }
        if (idx >= jsUrls.length) {
          try {
            var cachedFallback = localStorage.getItem(LEAFLET_CACHE_KEY);
            if (cachedFallback && cachedFallback.length > 20000) {
              var cs = document.createElement('script');
              cs.textContent = cachedFallback;
              document.head.appendChild(cs);
              if (typeof window.L !== 'undefined') {
                notifyMapReady();
                return;
              }
            }
          } catch (e) {}
          installOfflineLeafletEngine();
          return;
        }
        var s = document.createElement('script');
        s.src = jsUrls[idx].url;
        if (jsUrls[idx].sri) {
          s.crossOrigin = 'anonymous';
          s.integrity = jsUrls[idx].sri;
        }
        s.async = true;
        s.onload = function() {
          cacheLeafletSourceForOffline(jsUrls[idx].url);
          notifyMapReady();
        };
        s.onerror = function() { loadLeafletScript(idx + 1); };
        document.head.appendChild(s);
      }

      if (navigator.onLine === false) {
        loadLeafletScript(99);
      } else {
        loadLeafletScript(0);
        setTimeout(function() {
          if (typeof window.L === 'undefined') installOfflineLeafletEngine();
        }, 3200);
      }
    })();
  </script>
  <script id="klevDeviceLayoutDetector">
    (function() {
      function syncDeviceLayoutMode() {
        try {
          var w = window.innerWidth || document.documentElement.clientWidth || 390;
          var h = window.innerHeight || document.documentElement.clientHeight || 844;
          var isLandscape = w > h;
          var mode = 'mobile-portrait';
          if (w >= 900 && h > 540) {
            mode = 'desktop-tablet';
          } else if (isLandscape && (h <= 540 || w < 900)) {
            mode = 'mobile-landscape';
          }
          var docEl = document.documentElement;
          if (docEl.getAttribute('data-device-layout') !== mode) {
            docEl.setAttribute('data-device-layout', mode);
            if (typeof window.__KLEV_INVALIDATE_MAP_SIZE__ === 'function') {
              setTimeout(window.__KLEV_INVALIDATE_MAP_SIZE__, 80);
            }
          }
          if (typeof window.__KLEV_SYNC_MOBILE_GUEST__ === 'function') {
            window.__KLEV_SYNC_MOBILE_GUEST__();
          } else {
            var isApkNow = docEl.getAttribute('data-apk-webview') === '1' || typeof window.AndroidBridge !== 'undefined';
            var isMobEnv = (mode !== 'desktop-tablet') || isApkNow;
            var rawSt = localStorage.getItem('klev_pro_state_v2.0');
            var upSt = rawSt ? (JSON.parse(rawSt).userProfile || {}) : {};
            var fidSt = String(upSt.fisherId || '').trim().toUpperCase();
            var isTempFid = !fidSt || /^FP_\d{2}RZ\d{4}$/i.test(fidSt);
            var isAuthed = Boolean(upSt.ownerUnlocked || (upSt.login && upSt.login !== 'Рыболов' && (upSt.pinHash || upSt.authTokenHash) && !isTempFid));
            docEl.setAttribute('data-mobile-guest', (isMobEnv && !isAuthed) ? '1' : '0');
          }
        } catch (_e) {}
      }
      window.__KLEV_SYNC_DEVICE_LAYOUT__ = syncDeviceLayoutMode;
      syncDeviceLayoutMode();
      window.addEventListener('resize', syncDeviceLayoutMode, { passive: true });
      window.addEventListener('orientationchange', function() {
        setTimeout(syncDeviceLayoutMode, 60);
      }, { passive: true });
    })();
  </script>

    (function() {

        var splashEl = document.getElementById('appSplashScreen');

        var splashSub = document.getElementById('appSplashSubText');
        var splashPct = document.getElementById('appSplashPctText');
        var splashFill = document.getElementById('appSplashBarFill');
        if (splashEl && splashImg) {
          splashEl.setAttribute('data-app-splash-theme', theme);
          if (theme === 'light') {
            splashImg.src = 'assets/splash-light.jpg';
          } else if (theme === 'contrast') {
            splashImg.src = 'assets/splash-contrast.jpg';
          } else {
            splashImg.src = 'assets/splash-dark.jpg';
          }
        }
        var stages = [
          { ms: 0, pct: 12, text: 'Инициализация гео-ядра и карт водоёмов РФ...' },
          { ms: 550, pct: 38, text: 'Загрузка атласа 115 видов рыб и барической модели...' },

          { ms: 2220, pct: 100, text: 'Система Клёв ПРО 2.0 (v2.5.6 r215) готова к работе' }
        ];
        stages.forEach(function(st) {
          setTimeout(function() {
            if (splashSub) splashSub.textContent = st.text;
            if (splashPct) splashPct.textContent = st.pct + '%';
            if (splashFill) splashFill.style.width = st.pct + '%';

      setTimeout(function() {
        var sp = document.getElementById('appSplashScreen');

      }, 2450);
    })();
