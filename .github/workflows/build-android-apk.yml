      - name: Configure JDK 17 & Android SDK
        run: |
          if [ -n "$JAVA_HOME_17_X64" ]; then
            echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
            echo "$JAVA_HOME_17_X64/bin" >> $GITHUB_PATH
          fi
          java -version
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Restore Permanent Release Signing Keystore (Identical Signature Across All Updates)
        working-directory: ${{ steps.locate.outputs.proj_dir }}/app
        run: |
          echo "" | base64 -d > klevpro-release.keystore
          ls -la klevpro-release.keystore

      - name: Build Signed Obfuscated Release APK with Gradle 8.7
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7.zip
          unzip -q -o /tmp/gradle-8.7.zip -d /tmp
          set +e
          /tmp/gradle-8.7/bin/gradle assembleRelease --no-daemon --console=plain > /tmp/gradle_build.log 2>&1
          GRADLE_EXIT=$?
          set -e
          cat /tmp/gradle_build.log
          if [ $GRADLE_EXIT -ne 0 ]; then
            echo "=========================================="
            echo "❌ ТОЧНАЯ ПРИЧИНА ОШИБКИ GRADLE:"
            grep -E "(FAILURE:|What went wrong|^\* |Exception|Error:|error:)" -A 6 /tmp/gradle_build.log || tail -n 50 /tmp/gradle_build.log
            exit $GRADLE_EXIT
          fi

      - name: Rename Signed APK to klev-pro-v2.5.1.apk
        run: |
          REL_DIR="${{ steps.locate.outputs.proj_dir }}/app/build/outputs/apk/release"
          SRC_APK=$(ls "$REL_DIR"/*.apk | head -n 1)
          if [ -n "$SRC_APK" ]; then
            cp -f "$SRC_APK" "$REL_DIR/klev-pro-v2.5.1.apk"
          fi

      - name: Auto-Save Signed APK to Repository (/apk/klev-pro-v2.5.1.apk)
        run: |
          REL_APK="${{ steps.locate.outputs.proj_dir }}/app/build/outputs/apk/release/klev-pro-v2.5.1.apk"
          if [ -f "$REL_APK" ]; then
            mkdir -p apk
            rm -f apk/*.apk
            cp -f "$REL_APK" apk/klev-pro-v2.5.1.apk
            ls -lh apk/klev-pro-v2.5.1.apk
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A apk/
            if ! git diff --cached --quiet; then
              git commit -m "chore(apk): auto-publish klev-pro-v2.5.1.apk to /apk/ [skip ci]"
              git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
              git push origin HEAD:"${GITHUB_REF_NAME:-main}"
              echo "✅ Файл apk/klev-pro-v2.5.1.apk автоматически сохранён в каталог /apk/ репозитория!"
            else
              echo "ℹ️ Файл apk/klev-pro-v2.5.1.apk уже актуален."
            fi
          fi

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KlevPro-v2.5.1-Android-APK
          path: ${{ steps.locate.outputs.proj_dir }}/app/build/outputs/apk/release/klev-pro-v2.5.1.apk
