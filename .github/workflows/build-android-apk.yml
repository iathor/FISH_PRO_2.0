name: Build Signed Android APK (Klev PRO 2.0)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'apk/**.apk'

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-apk:
    if: github.event_name == 'workflow_dispatch' || (!startsWith(github.event.head_commit.message, 'chore(apk):') && !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-24.04
    steps:
      - name: Purge Old Workflow Artifacts (Free 0.5 GB GitHub Storage Quota)
        run: |
          ART_IDS=$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" | python3 -c "import sys,json; data=json.load(sys.stdin); print(' '.join(str(a['id']) for a in data.get('artifacts',[])))" 2>/dev/null || true)
          for AID in $ART_IDS; do
            curl -fsSL -X DELETE -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$AID" || true
          done

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-Unpack Release ZIP (Mobile Upload Support)
        run: |
          UNPACKED=0
          for ZFILE in FISH_PRO_2.0_SOURCE.zip FISH_PRO_2.0.zip; do
            if [ -f "$ZFILE" ]; then
              echo "Detected uploaded archive $ZFILE — unpacking into repository root..."
              unzip -q -o "$ZFILE" -d .
              rm -f "$ZFILE"
              UNPACKED=1
            fi
          done
          rm -rf klev-pro-2 standalone android/app/release-key.jks
          if [ "$UNPACKED" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore(release): auto-unpack release archive from mobile upload"
              git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
              git push origin HEAD:"${GITHUB_REF_NAME:-main}"
              curl -fsSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" || true
            fi
          fi

      - name: Locate & Self-Heal Android Project (Permanent Keystore & Clean Resources)
        id: locate
        run: |
          if [ -f "android/build.gradle" ]; then
            PROJ_DIR="android"
          elif [ -f "build.gradle" ]; then
            PROJ_DIR="."
          else
            FOUND=$(find . -maxdepth 3 -name "settings.gradle" | head -n 1)
            if [ -n "$FOUND" ]; then
              PROJ_DIR=$(dirname "$FOUND")
            else
              PROJ_DIR="android"
              mkdir -p "$PROJ_DIR"
            fi
          fi
          echo "Project directory: $PROJ_DIR"
          echo "proj_dir=$PROJ_DIR" >> $GITHUB_ENV
          echo "proj_dir=$PROJ_DIR" >> $GITHUB_OUTPUT

          # 1. Очищаем и копируем свежие веб-ресурсы (включая все 115 PNG в assets/) в assets/www без вложения старого .apk внутрь нового .apk
          rm -rf "$PROJ_DIR/app/src/main/assets/www"
          mkdir -p "$PROJ_DIR/app/src/main/assets/www"
          if [ -f "kp-control-89.html" ]; then cp -f "kp-control-89.html" /tmp/kp-control-89-master.html; fi
          for f in index.html kp-control-89.html policy-version.json manifest.json version.json icon.svg icon-192.png icon-512.png apple-touch-icon.png sw.js css js assets; do
            if [ -e "$f" ]; then
              cp -r "$f" "$PROJ_DIR/app/src/main/assets/www/"
            fi
          done
          if [ -f "apk/apk-version.json" ]; then
            mkdir -p "$PROJ_DIR/app/src/main/assets/www/apk"
            cp -f "apk/apk-version.json" "$PROJ_DIR/app/src/main/assets/www/apk/apk-version.json"
          fi

          # 2. Удаляем ВСЕ скрытые файлы (.gitkeep и др.) из assets и res
          find "$PROJ_DIR/app/src/main" -name ".*" -type f -delete || true

          # 3. Устраняем конфликты дублирующихся ресурсов в res/drawable
          mkdir -p "$PROJ_DIR/app/src/main/res/drawable" "$PROJ_DIR/app/src/main/res/values" "$PROJ_DIR/app/src/main/java/ru/klevpro/app"
          rm -f "$PROJ_DIR/app/src/main/res/drawable/"*.xml
          rm -rf "$PROJ_DIR/app/src/main/res/drawable-v24" "$PROJ_DIR/app/src/main/res/mipmap"*

          if [ -f "icon-512.png" ]; then
            cp -f "icon-512.png" "$PROJ_DIR/app/src/main/res/drawable/ic_launcher.png"
          elif [ ! -f "$PROJ_DIR/app/src/main/res/drawable/ic_launcher.png" ]; then
            python3 -c 'import struct,zlib;w=h=192;raw=b"".join(b"\x00"+b"\x0e\xa5\xe9\xff"*w for _ in range(h));chunk=lambda t,d:struct.pack("!I",len(d))+t+d+struct.pack("!I",zlib.crc32(t+d)&0xffffffff);open("'"$PROJ_DIR"'/app/src/main/res/drawable/ic_launcher.png","wb").write(b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack("!IIBBBBB",w,h,8,6,0,0,0))+chunk(b"IDAT",zlib.compress(raw))+chunk(b"IEND",b""))'
          fi

          # 4. Вычисляем строго возрастающий versionCode для релиза 2.5.6 r194 (чтобы Android всегда обновлял APK поверх старой версии)
          RUN_NUM=${GITHUB_RUN_NUMBER:-0}
          VER_CODE=$((260220 + RUN_NUM))
          echo "Using versionCode=$VER_CODE"

          cat << 'EOF' > "$PROJ_DIR/settings.gradle"
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KlevPro2"
          include ':app'
          EOF

          cat << 'EOF' > "$PROJ_DIR/build.gradle"
          plugins {
              id 'com.android.application' version '8.4.2' apply false
          }
          EOF

          cat << 'EOF' > "$PROJ_DIR/gradle.properties"
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << EOF > "$PROJ_DIR/app/build.gradle"
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'ru.klevpro.app'
              compileSdk 34
              defaultConfig {
                  applicationId "ru.klevpro.app"
                  minSdk 24
                  targetSdk 34
                  versionCode ${VER_CODE}
                  versionName "2.5.6-r215"
              }
              signingConfigs {
                  release {
                      storeFile file("klevpro-release.keystore")
                      storePassword System.getenv("KLEV_KEYSTORE_PASSWORD") ?: "KlevProSecretKeystore"
                      keyAlias System.getenv("KLEV_KEY_ALIAS") ?: "klevpro"
                      keyPassword System.getenv("KLEV_KEYSTORE_PASSWORD") ?: "KlevProSecretKeystore"
                      enableV1Signing true
                      enableV2Signing true
                      enableV3Signing true
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.release
                  }
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
              aaptOptions {
                  ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~"
              }
          }
          dependencies {
          }
          EOF

          cat << 'EOF' > "$PROJ_DIR/app/proguard-rules.pro"
          -dontusemixedcaseclassnames
          -dontskipnonpubliclibraryclasses
          -keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod
          -keep class ru.klevpro.app.** { *; }
          -dontwarn **
          EOF

          cat << 'EOF' > "$PROJ_DIR/app/src/main/res/values/strings.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Клёв ПРО 2.0</string>
          </resources>
          EOF

          cat << 'EOF' > "$PROJ_DIR/app/src/main/AndroidManifest.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboard|keyboardHidden|navigation|uiMode|density|fontScale|touchscreen|locale|layoutDirection|colorMode|mcc|mnc"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="klevpro.ru" />
                          <data android:scheme="https" android:host="xn--b1apdneg0j.xn--p1ai" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > "$PROJ_DIR/app/src/main/java/ru/klevpro/app/MainActivity.java"
          package ru.klevpro.app;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.ClipData;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.util.Base64;
          import android.view.Window;
          import android.webkit.DownloadListener;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import android.window.OnBackInvokedCallback;
          import android.window.OnBackInvokedDispatcher;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.atomic.AtomicInteger;

          public class MainActivity extends Activity {
              private static final int REQ_PERMISSIONS = 1001;
              private static final int REQ_FILE_CHOOSER = 1002;
              private static final int REQ_CAMERA_CAPTURE = 1003;
              private static final int REQ_CAMERA_PERM = 1004;
              private static final String VIRTUAL_HOST = "appassets.androidplatform.net";
              private static final String CHANNEL_ALERTS = "klev_pro_alerts";
              private static final String CHANNEL_FILES = "klev_pro_files";
              private static final String PERM_POST_NOTIFICATIONS = "android.permission.POST_NOTIFICATIONS";
              private static final String PERM_READ_MEDIA_IMAGES = "android.permission.READ_MEDIA_IMAGES";
              private static final AtomicInteger NOTIF_ID_SEQ = new AtomicInteger(2000);

              private WebView webView;
              private ValueCallback<Uri[]> fileUploadCallback;
              private boolean pendingCameraLaunchAfterPerm = false;
              private Uri pendingCameraPhotoUri = null;
              private long lastRootBackPressMs = 0L;
              private OnBackInvokedCallback backInvokedCallback;

              public class NativeBridge {
                  private final Context ctx;

                  public NativeBridge(Context ctx) {
                      this.ctx = ctx;
                  }

                  @JavascriptInterface
                  public boolean hasCameraAndPhotoPermissions() {
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              boolean camOk = checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED;
                              boolean mediaOk = true;
                              if (Build.VERSION.SDK_INT >= 33) {
                                  mediaOk = checkSelfPermission(PERM_READ_MEDIA_IMAGES) == PackageManager.PERMISSION_GRANTED;
                              } else {
                                  mediaOk = checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED;
                              }
                              return camOk && mediaOk;
                          }
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void openNativeCamera() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                                      pendingCameraLaunchAfterPerm = true;
                                      requestPermissions(new String[]{Manifest.permission.CAMERA}, REQ_CAMERA_PERM);
                                      return;
                                  }
                              }
                              launchNativeCameraIntent();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void requestCameraAndPhotoPermissions() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  List<String> needed = new ArrayList<>();
                                  if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                                      needed.add(Manifest.permission.CAMERA);
                                  }
                                  if (Build.VERSION.SDK_INT >= 33) {
                                      if (checkSelfPermission(PERM_READ_MEDIA_IMAGES) != PackageManager.PERMISSION_GRANTED) {
                                          needed.add(PERM_READ_MEDIA_IMAGES);
                                      }
                                  } else {
                                      if (checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                                          needed.add(Manifest.permission.READ_EXTERNAL_STORAGE);
                                      }
                                  }
                                  if (!needed.isEmpty()) {
                                      requestPermissions(needed.toArray(new String[0]), REQ_PERMISSIONS);
                                  }
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public boolean isSystemLocationEnabled() {
                      try {
                          android.location.LocationManager lm = (android.location.LocationManager) ctx.getSystemService(Context.LOCATION_SERVICE);
                          if (lm == null) return true;
                          return lm.isProviderEnabled(android.location.LocationManager.GPS_PROVIDER)
                              || lm.isProviderEnabled(android.location.LocationManager.NETWORK_PROVIDER);
                      } catch (Exception e) {
                          return true;
                      }
                  }

                  @JavascriptInterface
                  public void openLocationSourceSettings() {
                      try {
                          Intent intent = new Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(intent);
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public boolean isIgnoringBatteryOptimizations() {
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              android.os.PowerManager pm = (android.os.PowerManager) ctx.getSystemService(Context.POWER_SERVICE);
                              if (pm != null) {
                                  return pm.isIgnoringBatteryOptimizations(ctx.getPackageName());
                              }
                          }
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void requestIgnoreBatteryOptimizations() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                      Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                                      intent.setData(Uri.parse("package:" + ctx.getPackageName()));
                                      startActivity(intent);
                                  }
                              } catch (Exception e) {
                                  try {
                                      Intent fallback = new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS);
                                      startActivity(fallback);
                                  } catch (Exception ignored) {}
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public boolean hasBackgroundLocationPermission() {
                      try {
                          if (Build.VERSION.SDK_INT >= 29) {
                              return checkSelfPermission("android.permission.ACCESS_BACKGROUND_LOCATION") == PackageManager.PERMISSION_GRANTED;
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              return checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                          }
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void requestBackgroundLocationPermission() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  if (Build.VERSION.SDK_INT >= 29) {
                                      if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                                          requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION, "android.permission.ACCESS_BACKGROUND_LOCATION"}, REQ_PERMISSIONS);
                                      } else {
                                          requestPermissions(new String[]{"android.permission.ACCESS_BACKGROUND_LOCATION"}, REQ_PERMISSIONS);
                                      }
                                  } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                      requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, REQ_PERMISSIONS);
                                  }
                              } catch (Exception ignored) {}
                          }
                      });
                  }

                  @JavascriptInterface
                  public void setKeepScreenAndCpuAwake(final boolean enabled) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  if (enabled) {
                                      getWindow().addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                                  } else {
                                      getWindow().clearFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                                  }
                              } catch (Exception ignored) {}
                          }
                      });
                  }
                  @JavascriptInterface
                  public String getDeviceId() {
                      try {
                          String id = Settings.Secure.getString(ctx.getContentResolver(), Settings.Secure.ANDROID_ID);
                          return id != null ? id : "";
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public String getAppVersion() {
                      return "2.5.6-r215";
                  }

                  @JavascriptInterface
                  public int getAppBuildNumber() {
                      return 210;
                  }

                  @JavascriptInterface
                  public String getAppRevision() {
                      return "r215";
                  }

                  @JavascriptInterface
                  public void downloadApkUpdate(String url) {
                      if (url == null || url.trim().isEmpty()) return;
                      try {
                          Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url.trim()));
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(intent);
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public boolean areNotificationsEnabled() {
                      try {
                          NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm == null) return false;
                          if (Build.VERSION.SDK_INT >= 33) {
                              if (checkSelfPermission(PERM_POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                                  return false;
                              }
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                              return nm.areNotificationsEnabled();
                          }
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void requestNotificationPermission() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              initNotificationChannels();
                              if (Build.VERSION.SDK_INT >= 33) {
                                  if (checkSelfPermission(PERM_POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                                      requestPermissions(new String[]{PERM_POST_NOTIFICATIONS}, REQ_PERMISSIONS);
                                      return;
                                  }
                              }
                              NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                              if (nm != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.N && !nm.areNotificationsEnabled()) {
                                  openNotificationSettings();
                              } else {
                                  showSystemNotification("Клёв ПРО 2.0 • Уведомления активны", "Системные уведомления Круга, Экипажа, Чатов и SOS успешно подключены!", "test");
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void openNotificationSettings() {
                      try {
                          Intent intent = new Intent();
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              intent.setAction(Settings.ACTION_APP_NOTIFICATION_SETTINGS);
                              intent.putExtra(Settings.EXTRA_APP_PACKAGE, ctx.getPackageName());
                          } else {
                              intent.setAction(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                              intent.setData(Uri.fromParts("package", ctx.getPackageName(), null));
                          }
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(intent);
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void showSystemNotification(String title, String body, String category) {
                      try {
                          initNotificationChannels();
                          NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm == null) return;
                          if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(PERM_POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                              return;
                          }

                          String chanId = "files".equalsIgnoreCase(category) ? CHANNEL_FILES : CHANNEL_ALERTS;
                          Intent tapIntent = new Intent(ctx, MainActivity.class);
                          tapIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
