                          boolean camGranted = true;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              camGranted = checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED;
                          }
                          if (camGranted) {
                              launchNativeCameraIntent();
                          } else {
                              if (fileUploadCallback != null) {
                                  fileUploadCallback.onReceiveValue(null);
                                  fileUploadCallback = null;
                              }
                              Toast.makeText(this, "Разрешите доступ к Камере в настройках приложения", Toast.LENGTH_LONG).show();
                          }
                      }
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_CAMERA_CAPTURE) {
                      if (resultCode == Activity.RESULT_OK) {
                          String dataUrl = null;
                          if (pendingCameraPhotoUri != null) {
                              dataUrl = decodeUriToDataUrl(pendingCameraPhotoUri);
                          }
                          if (dataUrl == null && data != null && data.getData() != null) {
                              dataUrl = decodeUriToDataUrl(data.getData());
                          }
                          if (dataUrl == null && data != null && data.getExtras() != null) {
                              Object rawBmp = data.getExtras().get("data");
                              if (rawBmp instanceof Bitmap) {
                                  dataUrl = bitmapToDataUrl((Bitmap) rawBmp);
                              }
                          }
                          if (fileUploadCallback != null) {
                              if (pendingCameraPhotoUri != null) {
                                  fileUploadCallback.onReceiveValue(new Uri[]{pendingCameraPhotoUri});
                              } else if (data != null && data.getData() != null) {
                                  fileUploadCallback.onReceiveValue(new Uri[]{data.getData()});
                              } else {
                                  fileUploadCallback.onReceiveValue(null);
                              }
                              fileUploadCallback = null;
                          }
                          if (dataUrl != null && webView != null) {
                              final String safeDataUrl = dataUrl;
                              webView.post(new Runnable() {
                                  @Override
                                  public void run() {
                                      webView.evaluateJavascript(
                                          "if (typeof window.__KLEV_ON_NATIVE_CAMERA_PHOTO__ === 'function') { window.__KLEV_ON_NATIVE_CAMERA_PHOTO__('" + safeDataUrl + "'); }",
                                          null
                                      );
                                  }
                              });
                          }
                      } else {
                          if (pendingCameraPhotoUri != null) {
                              try { getContentResolver().delete(pendingCameraPhotoUri, null, null); } catch (Exception ignored) {}
                              pendingCameraPhotoUri = null;
                          }
                          if (fileUploadCallback != null) {
                              fileUploadCallback.onReceiveValue(null);
                              fileUploadCallback = null;
                          }
                      }
                      return;
                  }

                  if (requestCode == REQ_FILE_CHOOSER && fileUploadCallback != null) {
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK) {
                          if (data != null && data.getData() != null) {
                              results = new Uri[]{data.getData()};
                          } else if (data != null && data.getClipData() != null) {
                              ClipData clip = data.getClipData();
                              int count = clip.getItemCount();
                              results = new Uri[count];
                              for (int i = 0; i < count; i++) {
                                  results[i] = clip.getItemAt(i).getUri();
                              }
                          } else if (pendingCameraPhotoUri != null) {
                              results = new Uri[]{pendingCameraPhotoUri};
                          }
                      }
                      if (results == null) {
                          results = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      }
                      fileUploadCallback.onReceiveValue(results);
                      fileUploadCallback = null;
                  }
              }

              private void handleAppBackGesture() {
                  if (webView == null) {
                      finish();
                      return;
                  }
                  webView.evaluateJavascript(
                      "(function(){ try { if (typeof window.__KLEV_HANDLE_BACK__ === 'function') { return window.__KLEV_HANDLE_BACK__('android') ? 'HANDLED' : 'ROOT'; } } catch(e){} return 'ROOT'; })()",
                      new ValueCallback<String>() {
                          @Override
                          public void onReceiveValue(String value) {
                              if (value != null && value.contains("HANDLED")) {
                                  return;
                              }
                              long now = System.currentTimeMillis();
                              if (now - lastRootBackPressMs < 2200L) {
                                  finish();
                              } else {
                                  lastRootBackPressMs = now;
                                  Toast.makeText(MainActivity.this, "Смахните «Назад» ещё раз для выхода из приложения", Toast.LENGTH_SHORT).show();
                              }
                          }
                      }
                  );
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  handleAppBackGesture();
              }
          }
          EOF

      - name: Configure JDK 17 & Android SDK
        run: |
          if [ -n "$JAVA_HOME_17_X64" ]; then
            echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
            echo "$JAVA_HOME_17_X64/bin" >> $GITHUB_PATH
          fi
          java -version
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Restore Release Signing Keystore from GitHub Secrets
        working-directory: ${{ steps.locate.outputs.proj_dir }}/app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          EFF_PASS="${KEYSTORE_PASS:-KlevProSecretKeystore}"
          EFF_ALIAS="${KEY_ALIAS:-klevpro}"
          echo "KLEV_KEYSTORE_PASSWORD=$EFF_PASS" >> $GITHUB_ENV
          echo "KLEV_KEY_ALIAS=$EFF_ALIAS" >> $GITHUB_ENV
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d '\n\r ' | base64 -d > klevpro-release.keystore
            echo "Restored klevpro-release.keystore from GitHub Secrets."
          else
            echo "ANDROID_KEYSTORE_BASE64 secret not set; generating signing keystore via keytool..."
            keytool -genkeypair -v -keystore klevpro-release.keystore -alias "$EFF_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$EFF_PASS" -keypass "$EFF_PASS" -dname "CN=KlevPro, OU=Mobile, O=KlevPro, L=NovyUrengoy, ST=YANAO, C=RU"
          fi
          ls -lh klevpro-release.keystore

      - name: Obfuscate & Minify Web Assets (Terser ES Module Mangle + Strip Comments)
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        run: |
          if command -v npx >/dev/null 2>&1; then
            find app/src/main/assets/www/js -name "*.js" -type f | while read -r jsf; do
              npx --yes terser "$jsf" --module --compress dead_code=true,drop_debugger=true,passes=2 --mangle --comments false -o "$jsf.obf" && mv "$jsf.obf" "$jsf"
            done
            if [ -f "app/src/main/assets/www/sw.js" ]; then
              npx --yes terser "app/src/main/assets/www/sw.js" --compress --mangle --comments false -o "app/src/main/assets/www/sw.js.obf" && mv "app/src/main/assets/www/sw.js.obf" "app/src/main/assets/www/sw.js"
            fi
          fi

      - name: Build Signed User APK (klev-pro-v2.5.6.apk — Pure User Contour)
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        run: |
          mkdir -p /tmp/klev-apk-dist
          rm -f app/src/main/assets/www/kp-control-89.html
          cat << 'EOF_PY' > /tmp/patch_user_apk.py
          import os, re
          p = 'app/src/main/assets/www/index.html'
          if os.path.exists(p):
              with open(p, 'r', encoding='utf-8') as f:
                  h = f.read()
              h = h.replace('window.__KLEV_ADMIN_CONTOUR__ = true;', 'window.__KLEV_ADMIN_CONTOUR__ = false;')
              if 'window.__KLEV_ADMIN_CONTOUR__' not in h:
                  h = h.replace('<head>', '<head>\n  <script>window.__KLEV_ADMIN_CONTOUR__ = false;</script>', 1)
              h = re.sub(r'<button[^>]*id="topNavAdminBtn"[^>]*>.*?</button>', '', h, flags=re.S)
              h = re.sub(r'<section[^>]*id="secAdmin"[^>]*>.*?</section>', '', h, flags=re.S)
              with open(p, 'w', encoding='utf-8') as f:
                  f.write(h)
          EOF_PY
          python3 /tmp/patch_user_apk.py
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7.zip
          unzip -q -o /tmp/gradle-8.7.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle assembleRelease --no-daemon --console=plain
          REL_DIR="app/build/outputs/apk/release"
          SRC_APK=$(ls -t "$REL_DIR"/*.apk | head -n 1)
          cp -f "$SRC_APK" /tmp/klev-apk-dist/klev-pro-v2.5.6.apk
          ls -lh /tmp/klev-apk-dist/klev-pro-v2.5.6.apk

      - name: Build Signed Owner Admin APK (klev-pro-admin-v2.5.6.apk — Separate Admin Contour)
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        run: |
          mkdir -p /tmp/klev-apk-dist
          if [ -f "/tmp/kp-control-89-master.html" ]; then
            cp -f "/tmp/kp-control-89-master.html" "app/src/main/assets/www/index.html"
            cp -f "/tmp/kp-control-89-master.html" "app/src/main/assets/www/kp-control-89.html"
          elif [ -f "../kp-control-89.html" ]; then
            cp -f "../kp-control-89.html" "app/src/main/assets/www/index.html"
            cp -f "../kp-control-89.html" "app/src/main/assets/www/kp-control-89.html"
          elif [ -f "kp-control-89.html" ]; then
            cp -f "kp-control-89.html" "app/src/main/assets/www/index.html"
            cp -f "kp-control-89.html" "app/src/main/assets/www/kp-control-89.html"
          fi
          grep -q 'id="secAdmin"' "app/src/main/assets/www/index.html"
          grep -q 'id="adminTopTabBar"' "app/src/main/assets/www/index.html"
          ! grep -q 'id="secForecast"' "app/src/main/assets/www/index.html"
          ! grep -q 'id="secCircle"' "app/src/main/assets/www/index.html"
          sed -i 's/applicationId "ru.klevpro.app"/applicationId "ru.klevpro.admin"/g' app/build.gradle
          sed -i 's/<string name="app_name">Клёв ПРО 2.0<\/string>/<string name="app_name">Клёв ПРО Админ<\/string>/g' app/src/main/res/values/strings.xml
          sed -i '/android:host="klevpro.ru"/d' app/src/main/AndroidManifest.xml
          sed -i '/android:host="xn--b1apdneg0j.xn--p1ai"/d' app/src/main/AndroidManifest.xml
          /tmp/gradle-8.7/bin/gradle clean assembleRelease --no-daemon --console=plain
          REL_DIR="app/build/outputs/apk/release"
          ADMIN_SRC=$(ls -t "$REL_DIR"/*.apk | head -n 1)
          cp -f "$ADMIN_SRC" /tmp/klev-apk-dist/klev-pro-admin-v2.5.6.apk
          cp -f /tmp/klev-apk-dist/klev-pro-v2.5.6.apk "$REL_DIR/klev-pro-v2.5.6.apk"
          cp -f /tmp/klev-apk-dist/klev-pro-admin-v2.5.6.apk "$REL_DIR/klev-pro-admin-v2.5.6.apk"
          ls -lh /tmp/klev-apk-dist/

      - name: Auto-Save User & Admin APKs to Repository (/apk/)
        run: |
          mkdir -p apk
          rm -f apk/*.apk
          if [ -f "/tmp/klev-apk-dist/klev-pro-v2.5.6.apk" ]; then
            cp -f "/tmp/klev-apk-dist/klev-pro-v2.5.6.apk" apk/klev-pro-v2.5.6.apk
          fi
          if [ -f "/tmp/klev-apk-dist/klev-pro-admin-v2.5.6.apk" ]; then
            cp -f "/tmp/klev-apk-dist/klev-pro-admin-v2.5.6.apk" apk/klev-pro-admin-v2.5.6.apk
          fi
          ls -lh apk/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apk/
          if ! git diff --cached --quiet; then
            git commit -m "chore(apk): auto-publish user & admin apks v2.5.6"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
            git push origin HEAD:"${GITHUB_REF_NAME:-main}"
          curl -fsSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" || true
          fi

      - name: Upload Signed User APK Artifact (klev-pro-v2.5.6.apk)
        uses: actions/upload-artifact@v4
        with:
          name: KlevPro-User-v2.5.6-Android-APK
          path: /tmp/klev-apk-dist/klev-pro-v2.5.6.apk
          retention-days: 1

      - name: Upload Signed Owner Admin APK Artifact (klev-pro-admin-v2.5.6.apk)
        uses: actions/upload-artifact@v4
        with:
          name: KlevPro-Admin-v2.5.6-Android-APK
          path: /tmp/klev-apk-dist/klev-pro-admin-v2.5.6.apk
          retention-days: 1
