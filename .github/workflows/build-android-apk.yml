name: Build Signed Android APK (Klev PRO 2.0)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'apk/**.apk'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    if: github.event_name == 'workflow_dispatch' || (!startsWith(github.event.head_commit.message, 'chore(apk):') && !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-24.04
    steps:
      - name: Purge Old Workflow Artifacts (Free 0.5 GB GitHub Storage Quota)
        run: |
          ART_IDS=$(curl -sSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" | python3 -c "import sys,json; data=json.load(sys.stdin); print(' '.join(str(a['id']) for a in data.get('artifacts',[])))" 2>/dev/null || true)
          for AID in $ART_IDS; do
            curl -sSL -X DELETE -H "Accept: application/vnd.github+json" -o /dev/null -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$AID" || true
          done

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-Unpack Release ZIP (Mobile Upload Support)
        run: |
          for ZFILE in FISH_PRO_2.0_SOURCE.zip FISH_PRO_2.0.zip FISH_PRO_2.0_r247.zip FISH_PRO_2.0_SOURCE_r247.zip; do
            if [ -f "$ZFILE" ]; then
              echo "Detected uploaded archive $ZFILE — unpacking into repository root..."
              unzip -q -o "$ZFILE" -d .
              rm -f "$ZFILE"
            fi
          done
          rm -rf klev-pro-2 standalone android/app/release-key.jks

      - name: Prepare Android Assets & Resources (From android/ Directory)
        id: locate
        run: |
          PROJ_DIR="android"
          echo "Project directory: $PROJ_DIR"
          echo "proj_dir=$PROJ_DIR" >> $GITHUB_ENV
          echo "proj_dir=$PROJ_DIR" >> $GITHUB_OUTPUT

          # Ensure base android/ in repository is strictly User contour (ru.klevpro.app)
          sed -i 's/applicationId "ru.klevpro.admin"/applicationId "ru.klevpro.app"/g' "$PROJ_DIR/app/build.gradle"
          sed -i 's/<string name="app_name">Клёв ПРО Админ<\/string>/<string name="app_name">Клёв ПРО 2.0<\/string>/g' "$PROJ_DIR/app/src/main/res/values/strings.xml"

          rm -rf "$PROJ_DIR/app/src/main/assets/www"
          mkdir -p "$PROJ_DIR/app/src/main/assets/www"
          if [ -f "kp-control-89.html" ]; then cp -f "kp-control-89.html" /tmp/kp-control-89-master.html; fi
          if [ -f "icon-512.png" ]; then cp -f "icon-512.png" /tmp/icon-user-512.png; fi
          if [ -f "icon-admin-512.png" ]; then cp -f "icon-admin-512.png" /tmp/icon-admin-512.png; fi
          for f in index.html kp-control-89.html app-runtime.js VERSION policy-version.json manifest.json version.json icon.svg icon-192.png icon-512.png icon-admin-192.png icon-admin-512.png apple-touch-icon.png sw.js css js assets; do
            if [ -e "$f" ]; then
              cp -r "$f" "$PROJ_DIR/app/src/main/assets/www/"
            fi
          done
          if [ -f "apk/apk-version.json" ]; then
            mkdir -p "$PROJ_DIR/app/src/main/assets/www/apk"
            cp -f "apk/apk-version.json" "$PROJ_DIR/app/src/main/assets/www/apk/apk-version.json"
          fi

          find "$PROJ_DIR/app/src" -name ".*" -type f -delete || true
          mkdir -p "$PROJ_DIR/app/src/main/res/drawable" "$PROJ_DIR/app/src/main/res/values"
          rm -f "$PROJ_DIR/app/src/main/res/drawable/"*.xml
          rm -rf "$PROJ_DIR/app/src/main/res/drawable-v24" "$PROJ_DIR/app/src/main/res/mipmap"*
          if [ -f "icon-512.png" ]; then
            cp -f "icon-512.png" "$PROJ_DIR/app/src/main/res/drawable/ic_launcher.png"
          fi
          cp -f "$PROJ_DIR/app/build.gradle" /tmp/user-build.gradle.bak
          cp -f "$PROJ_DIR/app/src/main/res/values/strings.xml" /tmp/user-strings.xml.bak
          cp -f "$PROJ_DIR/app/src/main/AndroidManifest.xml" /tmp/user-AndroidManifest.xml.bak
          cp -f "$PROJ_DIR/app/src/main/res/drawable/ic_launcher.png" /tmp/user-ic_launcher.png.bak

      - name: Configure JDK 17 & Android SDK
        run: |
          if [ -n "$JAVA_HOME_17_X64" ]; then
            echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
            echo "$JAVA_HOME_17_X64/bin" >> $GITHUB_PATH
          fi
          java -version
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Restore Release Signing Keystore from GitHub Secrets
        working-directory: ${{ steps.locate.outputs.proj_dir }}/app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          DEFAULT_KS_B64=""
          DEFAULT_KS_PASS="KP3_fP1u54mZXdaYzrdj1anXoIb5wgoDEPxg"
          EFF_B64="${KEYSTORE_B64:-$DEFAULT_KS_B64}"
          EFF_PASS="${KEYSTORE_PASS:-$DEFAULT_KS_PASS}"
          EFF_ALIAS="${KEY_ALIAS:-klevpro_v3}"
          echo "KLEV_KEYSTORE_PASSWORD=$EFF_PASS" >> $GITHUB_ENV
          echo "KLEV_KEY_ALIAS=$EFF_ALIAS" >> $GITHUB_ENV
          echo "$EFF_B64" | tr -d '\n\r ' | base64 -d > klevpro-release.keystore
          echo "Restored permanent v3 release keystore (consistent signature across all updates)." 
          ls -lh klevpro-release.keystore

      - name: Obfuscate & Minify Web Assets (Terser ES Module Mangle + Strip Comments)
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        run: |
          if command -v terser >/dev/null 2>&1; then
            find app/src/main/assets/www/js -name "*.js" -type f | while read -r jsf; do
              terser "$jsf" --module --compress dead_code=true,drop_debugger=true,passes=2 --mangle --comments false -o "$jsf.obf" && mv "$jsf.obf" "$jsf" || true
            done
          fi

      - name: Build Signed User APK (klev-pro-v2.5.6.apk — Isolated Pure User Contour)
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        run: |
          mkdir -p /tmp/klev-apk-dist
          rm -rf /tmp/klev-android-user
          cp -a . /tmp/klev-android-user
          cd /tmp/klev-android-user

          sed -i 's/applicationId "ru.klevpro.admin"/applicationId "ru.klevpro.app"/g' app/build.gradle
          sed -i 's/<string name="app_name">Клёв ПРО Админ<\/string>/<string name="app_name">Клёв ПРО 2.0<\/string>/g' app/src/main/res/values/strings.xml
          if [ -f "/tmp/icon-user-512.png" ]; then
            cp -f "/tmp/icon-user-512.png" "app/src/main/res/drawable/ic_launcher.png"
          fi
          grep -q 'applicationId "ru.klevpro.app"' app/build.gradle
          ! grep -q 'applicationId "ru.klevpro.admin"' app/build.gradle
          grep -q 'Клёв ПРО 2.0' app/src/main/res/values/strings.xml
          ! grep -q 'Клёв ПРО Админ' app/src/main/res/values/strings.xml
          if [ -f "/tmp/icon-user-512.png" ]; then
            cmp -s "/tmp/icon-user-512.png" "app/src/main/res/drawable/ic_launcher.png"
          fi

          rm -f app/src/main/assets/www/kp-control-89.html app/src/main/assets/www/icon-admin-512.png app/src/main/assets/www/icon-admin-192.png
          cat << 'EOF_PY' > /tmp/patch_user_apk.py
          import os, re
          p = 'app/src/main/assets/www/index.html'
          if os.path.exists(p):
              with open(p, 'r', encoding='utf-8') as f:
                  h = f.read()
              h = h.replace('window.__KLEV_ADMIN_CONTOUR__ = true;', 'window.__KLEV_ADMIN_CONTOUR__ = false;')
              if 'window.__KLEV_ADMIN_CONTOUR__' not in h:
                  h = h.replace('<head>', '<head>\n  <script>window.__KLEV_ADMIN_CONTOUR__ = false;</script>', 1)
              h = re.sub(r'<button[^>]*id="topNavAdminBtn"[^>]*>.*?</button>', '', h, flags=re.S)
              h = re.sub(r'<section[^>]*id="secAdmin"[^>]*>.*?</section>', '', h, flags=re.S)
              with open(p, 'w', encoding='utf-8') as f:
                  f.write(h)
          EOF_PY
          python3 /tmp/patch_user_apk.py
          grep -q 'id="secForecast"' "app/src/main/assets/www/index.html"
          ! grep -q 'id="adminTopTabBar"' "app/src/main/assets/www/index.html"

          if [ ! -x "/tmp/gradle-8.7/bin/gradle" ]; then
            curl -sSL --retry 5 --retry-delay 3 --retry-all-errors https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7.zip || curl -sSL --retry 5 --retry-delay 3 https://downloads.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7.zip
            unzip -q -o /tmp/gradle-8.7.zip -d /tmp
          fi
          /tmp/gradle-8.7/bin/gradle clean assembleRelease --no-daemon --console=plain
          REL_DIR="app/build/outputs/apk/release"
          SRC_APK=$(ls -t "$REL_DIR"/*.apk | head -n 1)
          cp -f "$SRC_APK" /tmp/klev-apk-dist/klev-pro-v2.5.6.apk
          ls -lh /tmp/klev-apk-dist/klev-pro-v2.5.6.apk

      - name: Build Signed Owner Admin APK (klev-pro-admin-v2.5.6.apk — Isolated Separate Admin Contour)
        working-directory: ${{ steps.locate.outputs.proj_dir }}
        run: |
          mkdir -p /tmp/klev-apk-dist
          rm -rf /tmp/klev-android-admin
          cp -a . /tmp/klev-android-admin
          cd /tmp/klev-android-admin

          if [ -f "/tmp/kp-control-89-master.html" ]; then
            cp -f "/tmp/kp-control-89-master.html" "app/src/main/assets/www/index.html"
            cp -f "/tmp/kp-control-89-master.html" "app/src/main/assets/www/kp-control-89.html"
          fi
          grep -q 'id="secAdmin"' "app/src/main/assets/www/index.html"
          grep -q 'id="adminTopTabBar"' "app/src/main/assets/www/index.html"
          ! grep -q 'id="secForecast"' "app/src/main/assets/www/index.html"
          ! grep -q 'id="secCircle"' "app/src/main/assets/www/index.html"

          sed -i 's/applicationId "ru.klevpro.app"/applicationId "ru.klevpro.admin"/g' app/build.gradle
          sed -i 's/<string name="app_name">Клёв ПРО 2.0<\/string>/<string name="app_name">Клёв ПРО Админ<\/string>/g' app/src/main/res/values/strings.xml
          if [ -f "/tmp/icon-admin-512.png" ]; then
            cp -f "/tmp/icon-admin-512.png" "app/src/main/res/drawable/ic_launcher.png"
          fi
          grep -q 'applicationId "ru.klevpro.admin"' app/build.gradle
          ! grep -q 'applicationId "ru.klevpro.app"' app/build.gradle
          grep -q 'Клёв ПРО Админ' app/src/main/res/values/strings.xml
          ! grep -q 'Клёв ПРО 2.0' app/src/main/res/values/strings.xml
          if [ -f "/tmp/icon-admin-512.png" ]; then
            cmp -s "/tmp/icon-admin-512.png" "app/src/main/res/drawable/ic_launcher.png"
          fi

          sed -i '/android:host="klevpro.ru"/d' app/src/main/AndroidManifest.xml
          sed -i '/android:host="xn--b1apdneg0j.xn--p1ai"/d' app/src/main/AndroidManifest.xml
          /tmp/gradle-8.7/bin/gradle clean assembleRelease --no-daemon --console=plain
          REL_DIR="app/build/outputs/apk/release"
          ADMIN_SRC=$(ls -t "$REL_DIR"/*.apk | head -n 1)
          cp -f "$ADMIN_SRC" /tmp/klev-apk-dist/klev-pro-admin-v2.5.6.apk
          ls -lh /tmp/klev-apk-dist/

      - name: Auto-Save User & Admin APKs and Publish Clean Release to GitHub Pages
        run: |
          # Restore clean User contour in android/ before git commit so repository never stays in ru.klevpro.admin state
          if [ -f "/tmp/user-build.gradle.bak" ]; then cp -f /tmp/user-build.gradle.bak android/app/build.gradle; fi
          if [ -f "/tmp/user-strings.xml.bak" ]; then cp -f /tmp/user-strings.xml.bak android/app/src/main/res/values/strings.xml; fi
          if [ -f "/tmp/user-AndroidManifest.xml.bak" ]; then cp -f /tmp/user-AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml; fi
          if [ -f "/tmp/user-ic_launcher.png.bak" ]; then cp -f /tmp/user-ic_launcher.png.bak android/app/src/main/res/drawable/ic_launcher.png; fi
          grep -q 'applicationId "ru.klevpro.app"' android/app/build.gradle
          grep -q 'Клёв ПРО 2.0' android/app/src/main/res/values/strings.xml
          # Clean temporary duplicated Android assets/www and build dirs before committing to Git so GitHub Pages artifact stays fast & compact
          rm -rf android/app/src/main/assets/www android/build android/app/build android/.gradle android/app/klevpro-release.keystore /tmp/klev-android-user /tmp/klev-android-admin FISH_PRO_2.0*.zip
          touch .nojekyll
          mkdir -p apk
          rm -f apk/*.apk
          if [ -f "/tmp/klev-apk-dist/klev-pro-v2.5.6.apk" ]; then
            cp -f "/tmp/klev-apk-dist/klev-pro-v2.5.6.apk" apk/klev-pro-v2.9.1.apk
          fi
          if [ -f "/tmp/klev-apk-dist/klev-pro-admin-v2.5.6.apk" ]; then
            cp -f "/tmp/klev-apk-dist/klev-pro-admin-v2.5.6.apk" apk/klev-pro-admin-v2.9.1.apk
          fi
          ls -lh apk/
          EXPECTED_APK_NAME=$(node -e "const v=JSON.parse(require('fs').readFileSync('version.json','utf8')); console.log(new URL(v.apkUrl).pathname.replace(/^\/+/, ''));")
          if [ ! -s "$EXPECTED_APK_NAME" ]; then
            echo "ОШИБКА СБОРКИ: apkUrl в version.json указывает на $EXPECTED_APK_NAME, но файл отсутствует или пуст в каталоге apk/!"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): publish v2.9.1-r249 web & signed apks"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
            git push origin HEAD:"${GITHUB_REF_NAME:-main}"
          fi
          # Cancel any stuck in_progress/queued pages-build-deployment runs before triggering a clean Pages build
          STUCK_IDS=$(curl -sSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=20" | python3 -c "import sys,json; data=json.load(sys.stdin); print(' '.join(str(r['id']) for r in data.get('workflow_runs',[]) if r.get('name')=='pages build and deployment' and r.get('status') in ('in_progress','queued','waiting','pending')))" 2>/dev/null || true)
          for RID in $STUCK_IDS; do
            curl -sSL -X POST -H "Accept: application/vnd.github+json" -o /dev/null -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/$RID/cancel" || true
          done
          sleep 3
          curl -sSL -X POST -H "Accept: application/vnd.github+json" -o /dev/null -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" || true

      - name: Upload Signed User APK Artifact (klev-pro-v2.5.6.apk)
        uses: actions/upload-artifact@v4
        with:
          name: KlevPro-User-v2.5.6-Android-APK
          path: /tmp/klev-apk-dist/klev-pro-v2.5.6.apk
          retention-days: 1

      - name: Upload Signed Owner Admin APK Artifact (klev-pro-admin-v2.5.6.apk)
        uses: actions/upload-artifact@v4
        with:
          name: KlevPro-Admin-v2.5.6-Android-APK
          path: /tmp/klev-apk-dist/klev-pro-admin-v2.5.6.apk
          retention-days: 1
