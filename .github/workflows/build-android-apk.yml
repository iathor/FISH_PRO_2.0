name: Build Signed Android APK (Klev PRO 2.0)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'apk/**.apk'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate & Self-Heal Android Project (Permanent Keystore & Clean Resources)
        id: locate
        run: |
          if [ -f "android/build.gradle" ]; then
            PROJ_DIR="android"
          elif [ -f "build.gradle" ]; then
            PROJ_DIR="."
          else
            FOUND=$(find . -maxdepth 3 -name "settings.gradle" | head -n 1)
            if [ -n "$FOUND" ]; then
              PROJ_DIR=$(dirname "$FOUND")
            else
              PROJ_DIR="android"
              mkdir -p "$PROJ_DIR"
            fi
          fi
          echo "Project directory: $PROJ_DIR"
          echo "proj_dir=$PROJ_DIR" >> $GITHUB_ENV
          echo "proj_dir=$PROJ_DIR" >> $GITHUB_OUTPUT

          # 1. Очищаем и копируем свежие веб-ресурсы из общего корня репозитория в assets/www (без вложения старого .apk внутрь нового .apk)
          rm -rf "$PROJ_DIR/app/src/main/assets/www"
          mkdir -p "$PROJ_DIR/app/src/main/assets/www"
          for f in index.html manifest.json version.json icon.svg icon-192.png icon-512.png apple-touch-icon.png sw.js css js assets; do
            if [ -e "$f" ]; then
              cp -r "$f" "$PROJ_DIR/app/src/main/assets/www/"
            fi
          done
          if [ -f "apk/apk-version.json" ]; then
            mkdir -p "$PROJ_DIR/app/src/main/assets/www/apk"
            cp -f "apk/apk-version.json" "$PROJ_DIR/app/src/main/assets/www/apk/apk-version.json"
          fi

          # 2. Удаляем ВСЕ скрытые файлы (.gitkeep и др.) из assets и res
          find "$PROJ_DIR/app/src/main" -name ".*" -type f -delete || true

          # 3. Устраняем конфликты дублирующихся ресурсов в res/drawable
          mkdir -p "$PROJ_DIR/app/src/main/res/drawable" "$PROJ_DIR/app/src/main/res/values" "$PROJ_DIR/app/src/main/java/ru/klevpro/app"
          rm -f "$PROJ_DIR/app/src/main/res/drawable/"*.xml
          rm -rf "$PROJ_DIR/app/src/main/res/drawable-v24" "$PROJ_DIR/app/src/main/res/mipmap"*

          if [ -f "icon-512.png" ]; then
            cp -f "icon-512.png" "$PROJ_DIR/app/src/main/res/drawable/ic_launcher.png"
          elif [ ! -f "$PROJ_DIR/app/src/main/res/drawable/ic_launcher.png" ]; then
            python3 -c 'import struct,zlib;w=h=192;raw=b"".join(b"\x00"+b"\x0e\xa5\xe9\xff"*w for _ in range(h));chunk=lambda t,d:struct.pack("!I",len(d))+t+d+struct.pack("!I",zlib.crc32(t+d)&0xffffffff);open("'"$PROJ_DIR"'/app/src/main/res/drawable/ic_launcher.png","wb").write(b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack("!IIBBBBB",w,h,8,6,0,0,0))+chunk(b"IDAT",zlib.compress(raw))+chunk(b"IEND",b""))'
          fi

          # 4. Вычисляем строго возрастающий versionCode для релиза 2.5.1 r188 (чтобы Android всегда обновлял APK поверх старой версии)
          RUN_NUM=${GITHUB_RUN_NUMBER:-0}
          VER_CODE=$((251188 + RUN_NUM))
          echo "Using versionCode=$VER_CODE"

          cat << 'EOF' > "$PROJ_DIR/settings.gradle"
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KlevPro2"
          include ':app'
          EOF

          cat << 'EOF' > "$PROJ_DIR/build.gradle"
          plugins {
              id 'com.android.application' version '8.4.2' apply false
          }
          EOF

          cat << 'EOF' > "$PROJ_DIR/gradle.properties"
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << EOF > "$PROJ_DIR/app/build.gradle"
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'ru.klevpro.app'
              compileSdk 34
              defaultConfig {
                  applicationId "ru.klevpro.app"
                  minSdk 24
                  targetSdk 34
                  versionCode ${VER_CODE}
                  versionName "2.5.1-r188"
              }
              signingConfigs {
                  release {
                      storeFile file("klevpro-release.keystore")
                      storePassword "KlevPro2026!"
                      keyAlias "klevpro"
                      keyPassword "KlevPro2026!"
                      enableV1Signing true
                      enableV2Signing true
                      enableV3Signing true
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.release
                  }
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
              aaptOptions {
                  ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~"
              }
          }
          dependencies {
          }
          EOF

          cat << 'EOF' > "$PROJ_DIR/app/proguard-rules.pro"
          -dontusemixedcaseclassnames
          -dontskipnonpubliclibraryclasses
          -keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod
          -keep class ru.klevpro.app.** { *; }
          -dontwarn **
          EOF

          cat << 'EOF' > "$PROJ_DIR/app/src/main/res/values/strings.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Клёв ПРО 2.0</string>
          </resources>
          EOF

          cat << 'EOF' > "$PROJ_DIR/app/src/main/AndroidManifest.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="klevpro.ru" />
                          <data android:scheme="https" android:host="xn--b1apdneg0j.xn--p1ai" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > "$PROJ_DIR/app/src/main/java/ru/klevpro/app/MainActivity.java"
          package ru.klevpro.app;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.ClipData;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.util.Base64;
          import android.view.Window;
          import android.webkit.DownloadListener;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import android.window.OnBackInvokedCallback;
          import android.window.OnBackInvokedDispatcher;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.atomic.AtomicInteger;

          public class MainActivity extends Activity {
              private static final int REQ_PERMISSIONS = 1001;
              private static final int REQ_FILE_CHOOSER = 1002;
              private static final String VIRTUAL_HOST = "appassets.androidplatform.net";
              private static final String CHANNEL_ALERTS = "klev_pro_alerts";
              private static final String CHANNEL_FILES = "klev_pro_files";
              private static final String PERM_POST_NOTIFICATIONS = "android.permission.POST_NOTIFICATIONS";
              private static final AtomicInteger NOTIF_ID_SEQ = new AtomicInteger(2000);

              private WebView webView;
              private ValueCallback<Uri[]> fileUploadCallback;
              private long lastRootBackPressMs = 0L;
              private OnBackInvokedCallback backInvokedCallback;

              public class NativeBridge {
                  private final Context ctx;

                  public NativeBridge(Context ctx) {
                      this.ctx = ctx;
                  }

                  @JavascriptInterface
                  public String getDeviceId() {
                      try {
                          String id = Settings.Secure.getString(ctx.getContentResolver(), Settings.Secure.ANDROID_ID);
                          return id != null ? id : "";
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public String getAppVersion() {
                      return "2.5.1-r188";
                  }

                  @JavascriptInterface
                  public int getAppBuildNumber() {
                      return 188;
                  }

                  @JavascriptInterface
                  public String getAppRevision() {
                      return "r188";
                  }

                  @JavascriptInterface
                  public void downloadApkUpdate(String url) {
                      if (url == null || url.trim().isEmpty()) return;
                      try {
                          Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url.trim()));
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(intent);
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public boolean areNotificationsEnabled() {
                      try {
                          NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm == null) return false;
                          if (Build.VERSION.SDK_INT >= 33) {
                              if (checkSelfPermission(PERM_POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                                  return false;
                              }
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                              return nm.areNotificationsEnabled();
                          }
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void requestNotificationPermission() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              initNotificationChannels();
                              if (Build.VERSION.SDK_INT >= 33) {
                                  if (checkSelfPermission(PERM_POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                                      requestPermissions(new String[]{PERM_POST_NOTIFICATIONS}, REQ_PERMISSIONS);
                                      return;
                                  }
                              }
                              NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                              if (nm != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.N && !nm.areNotificationsEnabled()) {
                                  openNotificationSettings();
                              } else {
                                  showSystemNotification("Клёв ПРО 2.0 • Уведомления активны", "Системные уведомления Круга, Экипажа, Чатов и SOS успешно подключены!", "test");
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void openNotificationSettings() {
                      try {
                          Intent intent = new Intent();
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              intent.setAction(Settings.ACTION_APP_NOTIFICATION_SETTINGS);
                              intent.putExtra(Settings.EXTRA_APP_PACKAGE, ctx.getPackageName());
                          } else {
                              intent.setAction(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                              intent.setData(Uri.fromParts("package", ctx.getPackageName(), null));
                          }
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(intent);
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void showSystemNotification(String title, String body, String category) {
                      try {
                          initNotificationChannels();
                          NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm == null) return;
                          if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(PERM_POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                              return;
                          }

                          String chanId = "files".equalsIgnoreCase(category) ? CHANNEL_FILES : CHANNEL_ALERTS;
                          Intent tapIntent = new Intent(ctx, MainActivity.class);
                          tapIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                          int piFlags = PendingIntent.FLAG_UPDATE_CURRENT;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              piFlags |= PendingIntent.FLAG_IMMUTABLE;
                          }
                          PendingIntent pi = PendingIntent.getActivity(ctx, 0, tapIntent, piFlags);

                          Notification.Builder builder;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              builder = new Notification.Builder(ctx, chanId);
                          } else {
                              builder = new Notification.Builder(ctx)
                                  .setPriority(Notification.PRIORITY_HIGH)
                                  .setDefaults(Notification.DEFAULT_ALL);
                          }

                          builder.setSmallIcon(R.drawable.ic_launcher)
                              .setContentTitle(title != null && !title.isEmpty() ? title : "Клёв ПРО 2.0")
                              .setContentText(body != null ? body : "")
                              .setStyle(new Notification.BigTextStyle().bigText(body != null ? body : ""))
                              .setAutoCancel(true)
                              .setContentIntent(pi);

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                              builder.setVisibility(Notification.VISIBILITY_PUBLIC);
                              builder.setColor(Color.parseColor("#0284c7"));
                          }

                          nm.notify(NOTIF_ID_SEQ.incrementAndGet(), builder.build());
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public boolean saveFileToDownloads(final String filename, final String content, final String mimeType, final boolean isBase64) {
                      if (filename == null || filename.trim().isEmpty() || content == null) return false;
                      final String cleanName = filename.trim().replaceAll("[\\\\/:*?\"<>|]", "_");
                      final String effMime = (mimeType != null && !mimeType.trim().isEmpty()) ? mimeType.trim() : guessMimeType(cleanName);
                      try {
                          byte[] bytes;
                          if (isBase64) {
                              String pureB64 = content;
                              int commaIdx = pureB64.indexOf(',');
                              if (commaIdx != -1) {
                                  pureB64 = pureB64.substring(commaIdx + 1);
                              }
                              bytes = Base64.decode(pureB64, Base64.DEFAULT);
                          } else {
                              bytes = content.getBytes(StandardCharsets.UTF_8);
                          }

                          boolean saved = false;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentResolver resolver = ctx.getContentResolver();
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, cleanName);
                              values.put(MediaStore.Downloads.MIME_TYPE, effMime);
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri != null) {
                                  try (OutputStream os = resolver.openOutputStream(uri)) {
                                      if (os != null) {
                                          os.write(bytes);
                                          os.flush();
                                          saved = true;
                                      }
                                  }
                              }
                          }

                          if (!saved) {
                              File dlDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                              if (dlDir != null && (dlDir.exists() || dlDir.mkdirs())) {
                                  File outFile = new File(dlDir, cleanName);
                                  try (FileOutputStream fos = new FileOutputStream(outFile)) {
                                      fos.write(bytes);
                                      fos.flush();
                                      saved = true;
                                  }
                              }
                          }

                          if (saved) {
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      Toast.makeText(ctx, "✅ Файл сохранён в Загрузки (Downloads): " + cleanName, Toast.LENGTH_LONG).show();
                                  }
                              });
                              showSystemNotification("📥 Файл сохранён в «Загрузки»", cleanName + " (доступен в папке Downloads устройства)", "files");
                              return true;
                          }
                      } catch (Exception e) {
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  Toast.makeText(ctx, "Ошибка сохранения файла: " + cleanName, Toast.LENGTH_SHORT).show();
                              }
                          });
                      }
                      return false;
                  }
              }

              private void initNotificationChannels() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      try {
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm == null) return;

                          Uri soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                          AudioAttributes audioAttr = new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build();

                          NotificationChannel alertsChannel = new NotificationChannel(
                              CHANNEL_ALERTS,
                              "Сигналы Круга, Экипажа, Чаты и SOS",
                              NotificationManager.IMPORTANCE_HIGH
                          );
                          alertsChannel.setDescription("Мгновенные уведомления о точках в Круге, сообщениях в чатах Экипажа и экстренных сигналах SOS на воде");
                          alertsChannel.enableLights(true);
                          alertsChannel.setLightColor(Color.parseColor("#38bdf8"));
                          alertsChannel.enableVibration(true);
                          alertsChannel.setVibrationPattern(new long[]{0, 250, 150, 250});
                          alertsChannel.setShowBadge(true);
                          alertsChannel.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                          if (soundUri != null) {
                              alertsChannel.setSound(soundUri, audioAttr);
                          }
                          nm.createNotificationChannel(alertsChannel);

                          NotificationChannel filesChannel = new NotificationChannel(
                              CHANNEL_FILES,
                              "Выгрузка и сохранение файлов (.GPX, .JSON, .CSV)",
                              NotificationManager.IMPORTANCE_DEFAULT
                          );
                          filesChannel.setDescription("Уведомления о сохранении выгруженных путевых точек, журналов уловов и резервных копий в папку Загрузки");
                          filesChannel.setShowBadge(false);
                          nm.createNotificationChannel(filesChannel);
                      } catch (Exception ignored) {}
                  }
              }

              private static String guessMimeType(String path) {
                  String p = path.toLowerCase();
                  if (p.endsWith(".html") || p.endsWith(".htm")) return "text/html";
                  if (p.endsWith(".js") || p.endsWith(".mjs")) return "application/javascript";
                  if (p.endsWith(".css")) return "text/css";
                  if (p.endsWith(".json")) return "application/json";
                  if (p.endsWith(".gpx")) return "application/gpx+xml";
                  if (p.endsWith(".kml")) return "application/vnd.google-earth.kml+xml";
                  if (p.endsWith(".csv")) return "text/csv";
                  if (p.endsWith(".ics")) return "text/calendar";
                  if (p.endsWith(".svg")) return "image/svg+xml";
                  if (p.endsWith(".png")) return "image/png";
                  if (p.endsWith(".jpg") || p.endsWith(".jpeg")) return "image/jpeg";
                  if (p.endsWith(".webp")) return "image/webp";
                  if (p.endsWith(".ico")) return "image/x-icon";
                  if (p.endsWith(".apk")) return "application/vnd.android.package-archive";
                  return "application/octet-stream";
              }

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  initNotificationChannels();

                  Window window = getWindow();
                  if (window != null) {
                      window.setStatusBarColor(Color.parseColor("#0b1120"));
                      window.setNavigationBarColor(Color.parseColor("#151f32"));
                  }

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#0b1120"));
                  setContentView(webView);

                  WebView.setWebContentsDebuggingEnabled(false);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setDatabaseEnabled(true);
                  ws.setGeolocationEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setAllowContentAccess(true);
                  ws.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  webView.clearCache(true);
                  String baseUa = ws.getUserAgentString();
                  ws.setUserAgentString((baseUa != null ? baseUa : "") + " KlevProAPK/2.5.1-r188");

                  webView.addJavascriptInterface(new NativeBridge(this), "AndroidBridge");

                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                          if (url == null) return;
                          try {
                              if (url.startsWith("http://") || url.startsWith("https://")) {
                                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  startActivity(intent);
                              }
                          } catch (Exception ignored) {}
                      }
                  });

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if (uri != null && VIRTUAL_HOST.equalsIgnoreCase(uri.getHost())) {
                              String path = uri.getPath();
                              if (path == null || path.isEmpty() || path.equals("/")) {
                                  path = "/assets/www/index.html";
                              }
                              String assetPath = path.startsWith("/assets/") ? path.substring("/assets/".length()) : path.replaceFirst("^/+", "");
                              try {
                                  InputStream is = getAssets().open(assetPath);
                                  String mime = guessMimeType(assetPath);
                                  Map<String, String> headers = new HashMap<>();
                                  headers.put("Access-Control-Allow-Origin", "*");
                                  headers.put("Cache-Control", "no-store, no-cache, must-revalidate, max-age=0");
                                  return new WebResourceResponse(mime, "UTF-8", 200, "OK", headers, is);
                              } catch (Exception e) {
                                  return new WebResourceResponse("text/plain", "UTF-8", 404, "Not Found", null, null);
                              }
                          }
                          return super.shouldInterceptRequest(view, request);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
