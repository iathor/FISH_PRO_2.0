<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Страница не найдена • Клёв ПРО</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f1f5f9;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0284c7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      line-height: 1.5;
    }
    .wrap { max-width: 420px; }
    h1 {
      font-size: 72px;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 8px;
    }
    h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 24px;
    }
    a {
      display: inline-block;
      padding: 12px 24px;
      background: var(--accent);
      color: #fff;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      transition: opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    a:hover { opacity: 0.85; }
    a:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <h2>Страница не найдена</h2>
    <p>Возможно, ссылка устарела или содержит опечатку.</p>
    <a href="/FISH_PRO_2.0/">Перейти в «Клёв ПРО»</a>
  </div>
</body>
</html>
